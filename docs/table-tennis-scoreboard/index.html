		function buildGameTimelineSVG(gameData) {
			const log = gameData.log || [];
			const startPad = 8;
			const colStep = 36;
			const finalColWidth = 52;
			const rowHeight = 38;
			const totalHeight = rowHeight * 2;
			const totalWidth = startPad + Math.max(log.length, 1) * colStep + finalColWidth;

			const svgNS = 'http://www.w3.org/2000/svg';
			const svg = document.createElementNS(svgNS, 'svg');
			svg.setAttribute('width', String(totalWidth));
			svg.setAttribute('height', String(totalHeight));
			svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
			svg.style.display = 'block';
			svg.style.minWidth = `${totalWidth}px`;

			const yRow0 = rowHeight * 0.5;
			const yRow1 = rowHeight * 1.5;

			const addLine = (x1, y1, x2, y2, stroke, width = 1.5) => {
				const line = document.createElementNS(svgNS, 'line');
				line.setAttribute('x1', x1);
				line.setAttribute('y1', y1);
				line.setAttribute('x2', x2);
				line.setAttribute('y2', y2);
				line.setAttribute('stroke', stroke);
				line.setAttribute('stroke-width', width);
				svg.appendChild(line);
			};

			addLine(0, 1, totalWidth, 1, 'rgba(0, 0, 0, 0.12)', 1.5);
			addLine(0, rowHeight, totalWidth - finalColWidth, rowHeight, 'rgba(0, 0, 0, 0.08)', 1.2);
			addLine(0, totalHeight - 1, totalWidth, totalHeight - 1, 'rgba(0, 0, 0, 0.12)', 1.5);

			const finalX = totalWidth - finalColWidth;
			const rect = document.createElementNS(svgNS, 'rect');
			rect.setAttribute('x', finalX);
			rect.setAttribute('y', 2);
			rect.setAttribute('width', finalColWidth);
			rect.setAttribute('height', totalHeight - 4);
			rect.setAttribute('fill', '#d97706');
			rect.setAttribute('rx', '6');
			svg.appendChild(rect);

			const addText = (txt, x, y, color, size, weight = '800', anchor = 'middle') => {
				const t = document.createElementNS(svgNS, 'text');
				t.setAttribute('x', x);
				t.setAttribute('y', y);
				t.setAttribute('fill', color);
				t.setAttribute('font-size', size);
				t.setAttribute('font-weight', weight);
				t.setAttribute('text-anchor', anchor);
				t.setAttribute('dominant-baseline', 'central');
				t.textContent = txt;
				svg.appendChild(t);
				return t;
			};

			addText(String(gameData.p0), finalX + finalColWidth / 2, yRow0, '#ffffff', '14px', '900');
			addText(String(gameData.p1), finalX + finalColWidth / 2, yRow1, '#ffffff', '14px', '900');

			if (log.length > 1) {
				const polyPoints = log.map((entry, idx) => {
					const cx = startPad + idx * colStep + colStep / 2;
					const cy = entry.scorer === 0 ? yRow0 : yRow1;
					return `${cx},${cy}`;
				}).join(' ');

				const polyline = document.createElementNS(svgNS, 'polyline');
				polyline.setAttribute('points', polyPoints);
				polyline.setAttribute('fill', 'none');
				polyline.setAttribute('stroke', '#0284c7');
				polyline.setAttribute('stroke-width', '2.5');
				svg.appendChild(polyline);
			}

			log.forEach((entry, idx) => {
				const cx = startPad + idx * colStep + colStep / 2;

				[0, 1].forEach(teamId => {
					const cy = teamId === 0 ? yRow0 : yRow1;
					const isScorer = entry.scorer === teamId;
					const ptsVal = teamId === 0 ? entry.p0 : entry.p1;

					const circle = document.createElementNS(svgNS, 'circle');
					circle.setAttribute('cx', cx);
					circle.setAttribute('cy', cy);
					circle.setAttribute('r', isScorer ? '11' : '9.5');
					circle.setAttribute('fill', isScorer ? '#0284c7' : 'rgba(0, 0, 0, 0.06)');
					svg.appendChild(circle);

					addText(
						String(ptsVal),
						cx,
						cy,
						isScorer ? '#ffffff' : '#475569',
						isScorer ? '10.5px' : '9.5px',
						'900'
					);

					if (entry.server === teamId) {
						addLine(cx - 10, cy + 15, cx + 10, cy + 15, '#dc2626', 2.5);
					}
				});
			});

			return svg;
		}

		// ============================================================================
		// 10. モーダルダイアログ (ゲーム数選択・リセット確認・結果クリア確認)
		// ============================================================================
		const modalBackdropEl = document.getElementById('modal-backdrop');
		const modalTitleEl = document.getElementById('modal-title');
		const modalDescEl = document.getElementById('modal-desc');
		const modalBodyEl = document.getElementById('modal-body');
		const modalActionsEl = document.getElementById('modal-actions');

		function openModal({ title, desc = '', bodyContent = null, buttons, twoCols = false, gridMode = 'default' }) {
			state.modalOpen = true;
			modalTitleEl.textContent = title;
			if (desc && desc.trim()) {
				modalDescEl.textContent = desc;
				modalDescEl.style.display = 'block';
			} else {
				modalDescEl.textContent = '';
				modalDescEl.style.display = 'none';
			}

			if (modalBodyEl) {
				modalBodyEl.innerHTML = '';
				if (bodyContent) {
					if (typeof bodyContent === 'string') {
						modalBodyEl.innerHTML = bodyContent;
					} else if (bodyContent instanceof HTMLElement) {
						modalBodyEl.appendChild(bodyContent);
					}
					modalBodyEl.style.display = 'block';
				} else {
					modalBodyEl.style.display = 'none';
				}
			}

			modalActionsEl.innerHTML = '';
			modalActionsEl.className = 'modal-actions';
			if (twoCols) modalActionsEl.classList.add('two-cols-row');
			if (gridMode === 'format') modalActionsEl.classList.add('format-grid');

			buttons.forEach(btnDef => {
				const btn = document.createElement('button');
				btn.className = `modal-btn ${btnDef.variant || 'secondary'}`;
				if (btnDef.variant === 'cancel-full') {
					btn.style.gridColumn = '1 / -1';
				}
				btn.textContent = btnDef.label;
				if (btnDef.disabled) {
					btn.disabled = true;
				}
				btn.addEventListener('click', () => {
					if (btn.disabled) return;
					closeModal();
					if (btnDef.onClick) btnDef.onClick();
				});
				modalActionsEl.appendChild(btn);
			});

			modalBackdropEl.classList.add('active');
			requestAnimationFrame(() => {
				fitModalScale();
			});
		}

		function fitModalScale() {
			const modalCard = document.querySelector('.modal-card');
			if (!modalCard) return;
			modalCard.style.setProperty('--modal-scale', '1');

			const availH = window.innerHeight - 20;
			const cardH = modalCard.offsetHeight;

			if (cardH > availH && availH > 100) {
				const scaleFactor = Math.min(1, Math.floor((availH / cardH) * 96) / 100);
				modalCard.style.setProperty('--modal-scale', String(scaleFactor));
			}
		}

		function closeModal() {
			state.modalOpen = false;
			modalBackdropEl.classList.remove('active');
			if (modalBodyEl) {
				modalBodyEl.innerHTML = '';
				modalBodyEl.style.display = 'none';
			}
			const modalCard = document.querySelector('.modal-card');
			if (modalCard) modalCard.style.removeProperty('--modal-scale');
		}

		modalBackdropEl.addEventListener('click', (e) => {
			if (e.target === modalBackdropEl) {
				closeModal();
			}
		});

		function showResetConfirmModal() {
			openModal({
				title: 'リセットの確認',
				desc: 'リセットする範囲を選択してください。',
				twoCols: true,
				buttons: [
					{
						label: '現在のゲームをリセット',
						variant: 'primary',
						onClick: () => {
							const isFirstGame = state.completedGamesHistory.length === 0
								&& state.teams[0].games === 0
								&& state.teams[1].games === 0;
							if (isFirstGame) {
								resetEntireMatch();
								return;
							}
							const wasAutoSwapPending = state.autoSwapPending;
							cancelPendingAutoSwap();
							hideInboardBar();
							if (state.decidingSwapped && !wasAutoSwapPending) {
								[state.leftTeamIdx, state.rightTeamIdx] = [state.rightTeamIdx, state.leftTeamIdx];
							}
							state.teams[0].points = 0;
							state.teams[1].points = 0;
							state.currentGameRallyLog = [];
							state.actionUndoStack = [];
							state.decidingSwapped = false;
							syncUIAndBoard({ animate: true, direction: -1 });
							showToast('現在のゲームをリセットしました');
						}
					},
					{
						label: 'マッチ全体をリセット',
						variant: 'danger',
						onClick: () => {
							cancelPendingAutoSwap();
							hideInboardBar();
							resetEntireMatch();
						}
					},
					{
						label: 'キャンセル',
						variant: 'cancel-full'
					}
				]
			});
		}

		function showDeleteResultConfirmModal(targetMatchId = null) {
			if (state.matchRecords.length === 0) return;
			const isDeleteAll = targetMatchId === null;
			openModal({
				title: isDeleteAll ? '全ての試合結果を削除' : '試合結果の削除',
				desc: isDeleteAll
					? '保存されている全ての試合結果とスコア推移を削除しますか？\n（現在進行中のマッチは削除されません）'
					: '選択した試合結果とスコア推移を削除しますか？',
				twoCols: true,
				buttons: [
					{
						label: '削除する',
						variant: 'danger',
						onClick: () => {
							if (isDeleteAll) {
								state.matchRecords = [];
								state.currentSavedMatchId = null;
								saveMatchRecordsToStorage();
								saveActiveMatchToStorage();
								renderResultView();
								showToast('全ての試合結果を削除しました');
							} else {
								state.matchRecords = state.matchRecords.filter(r => r.id !== targetMatchId);
								if (state.currentSavedMatchId === targetMatchId) {
									state.currentSavedMatchId = null;
								}
								saveMatchRecordsToStorage();
								saveActiveMatchToStorage();
								renderResultView();
								showToast('試合結果を削除しました');
							}
						}
					},
					{
						label: 'キャンセル',
						variant: 'secondary'
					}
				]
			});
		}

		function showDataManagementModal() {
			const hasRecords = state.matchRecords.length > 0;
			openModal({
				title: 'データ管理',
				desc: '試合結果履歴データをファイルへ保存（エクスポート）するか、過去のバックアップファイルを取り込み（インポート）します。',
				twoCols: true,
				buttons: [
					{
						label: 'エクスポート (保存)',
						variant: 'primary',
						disabled: !hasRecords,
						onClick: () => {
							exportMatchRecordsToJson();
						}
					},
					{
						label: 'インポート (読込)',
						variant: 'primary',
						onClick: () => {
							inputImportResultsEl.value = '';
							inputImportResultsEl.click();
						}
					},
					{
						label: '閉じる',
						variant: 'cancel-full',
						onClick: () => {}
					}
				]
			});
		}

		function isMatchInProgress() {
			return (
				state.matchStarted ||
				state.teams[0].points > 0 ||
				state.teams[1].points > 0 ||
				state.teams[0].games > 0 ||
				state.teams[1].games > 0 ||
				state.completedGamesHistory.length > 0
			);
		}

		function showMatchFormatModal() {
			const inProgress = isMatchInProgress();
			const completedGames = Math.max(
				state.completedGamesHistory.length,
				state.teams[0].games + state.teams[1].games
			);
			const maxTeamGames = Math.max(state.teams[0].games, state.teams[1].games);
			const curMaxPoints = Math.max(state.teams[0].points, state.teams[1].points);

			// 一時選択保持（「決定」タップ時に反映）
			let selectedBestOf = state.bestOf;
			let selectedDeuceLimit = state.deuceLimit; // null または 11, 12, 13, 14, 15

			const bodyContainer = document.createElement('div');
			bodyContainer.className = 'format-modal-content';

			// --- セクション1: ゲーム数 ---
			const sectionGame = document.createElement('div');
			sectionGame.className = 'format-setting-group';
			const labelGame = document.createElement('div');
			labelGame.className = 'format-setting-label';
			labelGame.textContent = 'ゲーム数 (ゲームズマッチ)';
			sectionGame.appendChild(labelGame);

			const gridGame = document.createElement('div');
			gridGame.className = 'format-btn-grid cols-4';

			const gameButtons = [1, 3, 5, 7].map(num => {
				const neededGames = Math.ceil(num / 2);
				const isDisabled = inProgress && (num <= completedGames || maxTeamGames >= neededGames);
				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'format-choice-btn';
				btn.disabled = isDisabled;
				if (isDisabled) {
					btn.title = inProgress ? '進行中の試合状況より少ないゲーム数には変更できません' : '';
				}
				btn.addEventListener('click', () => {
					if (isDisabled) return;
					selectedBestOf = num;
					updateGameButtonsUI();
				});
				gridGame.appendChild(btn);
				return btn;
			});

			const updateGameButtonsUI = () => {
				gameButtons.forEach((b, i) => {
					const n = [1, 3, 5, 7][i];
					const isSel = selectedBestOf === n;
					b.classList.toggle('active', isSel);
					b.textContent = isSel ? `✓ ${n}G` : `${n}G`;
				});
			};
			updateGameButtonsUI();

			sectionGame.appendChild(gridGame);
			bodyContainer.appendChild(sectionGame);

			// --- セクション2: デュース上限（打ち切り点数） ---
			const sectionDeuce = document.createElement('div');
			sectionDeuce.className = 'format-setting-group';
			const labelDeuce = document.createElement('div');
			labelDeuce.className = 'format-setting-label';
			labelDeuce.textContent = 'デュース上限（打ち切り点数）';
			sectionDeuce.appendChild(labelDeuce);

			// 上限なし（公式ルール）ボタン
			const noneBtn = document.createElement('button');
			noneBtn.type = 'button';
			noneBtn.className = 'format-choice-btn';
			noneBtn.style.marginBottom = '6px';

			// 11〜15のボタン
			const gridDeuce = document.createElement('div');
			gridDeuce.className = 'format-btn-grid cols-5';

			const limitButtons = [];
			const limits = [11, 12, 13, 14, 15];

			const updateDeuceButtonsActive = () => {
				const isNoneSel = selectedDeuceLimit === null;
				noneBtn.classList.toggle('active', isNoneSel);
				noneBtn.textContent = isNoneSel ? '✓ 上限なし（公式ルール）' : '上限なし（公式ルール）';

				limitButtons.forEach((b, i) => {
					const lim = limits[i];
					const isLimSel = selectedDeuceLimit === lim;
					b.classList.toggle('active', isLimSel);
					b.textContent = isLimSel ? `✓ ${lim}本` : `${lim}本`;
				});
			};

			noneBtn.addEventListener('click', () => {
				selectedDeuceLimit = null;
				updateDeuceButtonsActive();
			});
			sectionDeuce.appendChild(noneBtn);

			limits.forEach(lim => {
				const btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'format-choice-btn';
				// 進行中の試合で、現在のゲームの最大得点がすでにその上限以上になっている場合は選択不可
				const isDisabled = inProgress && curMaxPoints >= lim;
				btn.disabled = isDisabled;
				btn.addEventListener('click', () => {
					if (isDisabled) return;
					selectedDeuceLimit = lim;
					updateDeuceButtonsActive();
				});
				gridDeuce.appendChild(btn);
				limitButtons.push(btn);
			});
			updateDeuceButtonsActive();
			sectionDeuce.appendChild(gridDeuce);

			bodyContainer.appendChild(sectionDeuce);

			openModal({
				title: inProgress ? 'マッチ形式の変更' : 'マッチ形式の設定',
				desc: '',
				bodyContent: bodyContainer,
				twoCols: true,
				buttons: [
					{
						label: '決定',
						variant: 'primary',
						onClick: () => {
							const bestOfChanged = state.bestOf !== selectedBestOf;
							const deuceChanged = state.deuceLimit !== selectedDeuceLimit;
							if (!bestOfChanged && !deuceChanged) return;

							state.bestOf = selectedBestOf;
							state.deuceLimit = selectedDeuceLimit;

							if (inProgress) {
								if (isDecidingGame() && (state.teams[0].points >= 5 || state.teams[1].points >= 5)) {
									state.decidingSwapped = true;
								}
								syncUIAndBoard({ animate: false });
								const limitText = state.deuceLimit ? `上限${state.deuceLimit}本` : '上限なし';
								showToast(`${state.bestOf}G (${limitText}) に変更しました`);
							} else {
								cancelPendingAutoSwap();
								hideInboardBar();
								resetEntireMatch();
								const limitText = state.deuceLimit ? `上限${state.deuceLimit}本` : '上限なし';
								showToast(`${state.bestOf}G (${limitText}) に設定しました`);
							}
						}
					},
					{
						label: 'キャンセル',
						variant: 'secondary'
					}
				]
			});
		}

		function resetEntireMatch() {
			cancelPendingAutoSwap();
			hideInboardBar();
			state.teams[0].points = 0;
			state.teams[0].games = 0;
			state.teams[1].points = 0;
			state.teams[1].games = 0;
			state.leftTeamIdx = 0;
			state.rightTeamIdx = 1;
			state.initialServerTeamIdx = 0;
			state.decidingSwapped = false;
			state.matchStarted = false;
			state.matchStartTime = null;
			state.matchEndTime = null;
			state.currentSavedMatchId = null;
			state.currentGameRallyLog = [];
			state.actionUndoStack = [];
			state.completedGamesHistory = [];
			syncUIAndBoard({ animate: true, direction: -1 });
			showToast('新しいマッチの準備ができました');
		}

		// ============================================================================
		// 11. 誤動作を防ぐ「タップ完了時（指を離した位置）」での即時カウントアップ
		// ============================================================================
		let activePointerId = null;
		let pressedUnit = null;

		function getHitUnitFromPoint(clientX, clientY) {
			const elem = document.elementFromPoint(clientX, clientY);
			if (!elem) return null;
			const cardEl = elem.closest('.flip-card');
			if (!cardEl) return null;
			return allUnits.find(u => u.el === cardEl) || null;
		}

		function clearPressedUnitState() {
			allUnits.forEach(u => u.setPressedHighlight(false));
			pressedUnit = null;
			activePointerId = null;
		}

		allUnits.forEach(unit => {
			unit.el.addEventListener('pointerdown', (e) => {
				sound.unlock();
				if (isInteractionLocked()) return;
				if (e.button === 2) return;

				activePointerId = e.pointerId;
				pressedUnit = unit;
				unit.setPressedHighlight(true);
			});

			unit.el.addEventListener('contextmenu', (e) => {
				e.preventDefault();
			});
		});

		window.addEventListener('pointermove', (e) => {
			if (e.pointerId !== activePointerId || !pressedUnit) return;
			const currentHoverUnit = getHitUnitFromPoint(e.clientX, e.clientY);
			pressedUnit.setPressedHighlight(currentHoverUnit === pressedUnit);
		});

		window.addEventListener('pointerup', (e) => {
			if (e.pointerId !== activePointerId || !pressedUnit) return;

			const targetUnit = pressedUnit;
			const releasedUnit = getHitUnitFromPoint(e.clientX, e.clientY);
			clearPressedUnitState();

			if (isInteractionLocked()) return;

			if (releasedUnit !== targetUnit) {
				return;
			}

			incrementPanelValue(targetUnit);
		});

		window.addEventListener('pointercancel', () => {
			clearPressedUnitState();
		});

		// ============================================================================
		// 12. ボタン・UIイベントリスナー
		// ============================================================================
		// スコアボード中央下の「試合開始」ボタン
		btnStartMatchEl.addEventListener('click', () => {
			sound.unlock();
			if (isInteractionLocked()) return;
			startMatchNow(true);
			showToast('試合を開始しました');
		});

		document.getElementById('btn-swap-top').addEventListener('click', () => {
			if (isInteractionLocked()) return;
			swapCourts('Change Ends');
			syncUIAndBoard({ animate: true, direction: 1 });
		});

		document.getElementById('btn-undo').addEventListener('click', () => {
			if (state.modalOpen || state.pendingPhase !== 'none') return;
			undoLastAction();
		});

		document.getElementById('btn-match-format').addEventListener('click', () => {
			if (isInteractionLocked()) return;
			showMatchFormatModal();
		});

		document.getElementById('btn-reset').addEventListener('click', () => {
			if (isInteractionLocked()) return;
			showResetConfirmModal();
		});

		// 試合結果ビュー開閉 & エクスポート/インポート & 結果クリアボタン
		document.getElementById('btn-result').addEventListener('click', () => {
			if (isInteractionLocked()) return;
			openResultView(false);
		});
		document.getElementById('btn-result-close').addEventListener('click', () => {
			closeResultView();
		});
		btnDataManageEl.addEventListener('click', () => {
			showDataManagementModal();
		});
		inputImportResultsEl.addEventListener('change', (e) => {
			const file = e.target.files && e.target.files[0];
			if (file) {
				importMatchRecordsFromJsonFile(file);
			}
			inputImportResultsEl.value = '';
		});
		btnClearResultsEl.addEventListener('click', () => {
			showDeleteResultConfirmModal(null);
		});

		// スコアボード右下の「推移」ボタン -> 現在のマッチの推移へ
		document.getElementById('btn-history').addEventListener('click', () => {
			if (isInteractionLocked()) return;
			openCurrentMatchHistoryView();
		});

		// スコア推移画面の「‹ 戻る」ボタン -> 遷移元（試合結果画面 または スコアボード）へ戻る
		document.getElementById('btn-history-close').addEventListener('click', () => {
			closeHistoryView();
			if (state.historyReturnTarget === 'results') {
				openResultView(true);
			}
		});

		const btnVoiceEl = document.getElementById('btn-voice');
		const voiceSvgOnEl = document.getElementById('voice-svg-on');
		const voiceSvgOffEl = document.getElementById('voice-svg-off');
		const voiceStateTextEl = document.getElementById('voice-state-text');

		function syncVoiceBtnUI() {
			btnVoiceEl.classList.toggle('off-state', !state.voiceEnabled);
			voiceSvgOnEl.style.display = state.voiceEnabled ? 'block' : 'none';
			voiceSvgOffEl.style.display = state.voiceEnabled ? 'none' : 'block';
			voiceStateTextEl.textContent = state.voiceEnabled ? 'VOICE' : 'MUTE';
		}

		btnVoiceEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			sound.unlock();
			state.voiceEnabled = !state.voiceEnabled;
			syncVoiceBtnUI();
			saveActiveMatchToStorage();
			if (state.voiceEnabled) {
				sound.speakEnglishCall(buildEnglishScoreCall());
			} else if ('speechSynthesis' in window) {
				try {
					window.speechSynthesis.cancel();
				} catch (e) {}
			}
			const iosNotice = (isIOS && state.voiceEnabled) ? ' (※消音モード時は鳴りません)' : '';
			showToast(`Voice Call: ${state.voiceEnabled ? 'ON' : 'OFF'}${iosNotice}`);
		});

		leftServeBarEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			if (getCurrentServerTeamIdx() !== state.leftTeamIdx) {
				state.initialServerTeamIdx = 1 - state.initialServerTeamIdx;
				syncUIAndBoard({ animate: false });
				showToast(`Server: ${state.teams[state.leftTeamIdx].name}`);
			}
		});
		rightServeBarEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			if (getCurrentServerTeamIdx() !== state.rightTeamIdx) {
				state.initialServerTeamIdx = 1 - state.initialServerTeamIdx;
				syncUIAndBoard({ animate: false });
				showToast(`Server: ${state.teams[state.rightTeamIdx].name}`);
			}
		});

		function syncCurrentSavedRecordPlayerNames() {
			if (!state.currentSavedMatchId) return;
			const rec = state.matchRecords.find(r => r.id === state.currentSavedMatchId);
			if (rec) {
				rec.player0Name = state.teams[0].name;
				rec.player1Name = state.teams[1].name;
				saveMatchRecordsToStorage();
			}
		}

		leftNameInputEl.addEventListener('input', () => {
			const defaultName = state.leftTeamIdx === 0 ? 'Player1' : 'Player2';
			state.teams[state.leftTeamIdx].name = leftNameInputEl.value.trim() || defaultName;
			fitScoreboardNameInput(leftNameInputEl);
			syncCurrentSavedRecordPlayerNames();
			saveActiveMatchToStorage();
		});
		leftNameInputEl.addEventListener('blur', () => {
			leftNameInputEl.value = state.teams[state.leftTeamIdx].name;
			fitScoreboardNameInput(leftNameInputEl);
		});
		rightNameInputEl.addEventListener('input', () => {
			const defaultName = state.rightTeamIdx === 0 ? 'Player1' : 'Player2';
			state.teams[state.rightTeamIdx].name = rightNameInputEl.value.trim() || defaultName;
			fitScoreboardNameInput(rightNameInputEl);
			syncCurrentSavedRecordPlayerNames();
			saveActiveMatchToStorage();
		});
		rightNameInputEl.addEventListener('blur', () => {
			rightNameInputEl.value = state.teams[state.rightTeamIdx].name;
			fitScoreboardNameInput(rightNameInputEl);
		});

		window.addEventListener('resize', () => {
			fitScoreboardNameInput(leftNameInputEl);
			fitScoreboardNameInput(rightNameInputEl);
			resultsListContainerEl.querySelectorAll('.result-player-name-input, .result-memo-input').forEach(el => {
				autoResizeResultNameTextarea(el);
			});
		});

		// ============================================================================
		// 13. PWA (Service Worker) 登録 & ランドスケープ（横画面）固定制御
		// ============================================================================
		// PWA Service Worker 登録
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('./sw.js').then((reg) => {
					console.log('TT-Scoreboard PWA ServiceWorker active:', reg.scope);
				}).catch((err) => {
					console.warn('TT-Scoreboard PWA ServiceWorker registration failed:', err);
				});
			});
		}

		// =========================================================
		// 画面向き & パネル縦長アスペクト比 (常に縦:横 4:3 以上) の常時自動保護
		// =========================================================
		function enforcePanelAspectRatio() {
			const wrapperEl = document.querySelector('.scoreboard-wrapper');
			const contentBoxEl = document.getElementById('scoreboard-content-box');
			if (!wrapperEl || !contentBoxEl) return;

			contentBoxEl.style.maxWidth = '1400px';
			contentBoxEl.style.maxHeight = '840px';

			const wrapperW = wrapperEl.clientWidth;
			const wrapperH = wrapperEl.clientHeight;
			if (wrapperW <= 0 || wrapperH <= 0) return;

			const isPortrait = wrapperH > wrapperW;

			if (isPortrait) {
				// 1. ポートレート（縦持ち）: 画面の横幅を基準に縮小表示し、カードが縦長になりすぎないよう高さを制御
				contentBoxEl.style.maxWidth = `${Math.floor(wrapperW)}px`;

				// カード幅から理想のカード高さ（縦横比 約1.36:1）を逆算
				const gridGap = 8;
				const totalGap = gridGap * 3;
				const cardW = Math.max(40, (wrapperW - totalGap) * (34 / 96));
				const idealCardH = cardW * 1.36;
				const idealStageH = idealCardH + 16 + 6; // serveBar + colGap
				const headerH = 34;
				const targetBoxH = Math.min(wrapperH, idealStageH + headerH + 8);

				contentBoxEl.style.maxHeight = `${Math.floor(targetBoxH)}px`;
			} else {
				// 2. ランドスケープ（横持ち）: 画面高さを活かして大画面展開（縦横比 4:3 以上を保証）
				contentBoxEl.style.maxHeight = '840px';

				const headerEl = document.querySelector('.top-header-bar');
				const headerH = headerEl ? headerEl.offsetHeight : 30;
				const contentBoxGap = parseFloat(window.getComputedStyle(contentBoxEl).gap) || 4;
				const stageAvailH = Math.max(80, wrapperH - headerH - contentBoxGap);

				const serveBarEl = document.getElementById('left-serve-bar');
				const serveBarH = serveBarEl ? serveBarEl.offsetHeight : 12;
				const pointColEl = document.querySelector('.point-col');
				const colGap = pointColEl ? (parseFloat(window.getComputedStyle(pointColEl).gap) || 6) : 6;
				const cardAvailH = Math.max(60, stageAvailH - serveBarH - colGap);

				const maxCardW = cardAvailH * 0.71;
				const stageEl = document.getElementById('scoreboard-stage');
				const stageComputedStyle = window.getComputedStyle(stageEl);
				const gridGap = parseFloat(stageComputedStyle.gap) || 12;
				const totalGap = gridGap * 3;

				const maxStageW = (maxCardW * (96 / 34)) + totalGap;
				const targetMaxW = Math.min(wrapperW, maxStageW, 1400);
				contentBoxEl.style.maxWidth = `${Math.floor(targetMaxW)}px`;
			}
		}

		// 画面サイズ変更・端末回転時のレイアウト自動追従
		function handleResizeAndLayout() {
			enforcePanelAspectRatio();
			if (state.modalOpen) {
				fitModalScale();
			}
			fitScoreboardNameInput(leftNameInputEl);
			fitScoreboardNameInput(rightNameInputEl);
			resultsListContainerEl.querySelectorAll('.result-player-name-input, .result-memo-input').forEach(el => {
				autoResizeResultNameTextarea(el);
			});
		}

		// Screen Orientation API による横画面ロック試行（対応ブラウザ向け）
		function tryLockScreenOrientation() {
			if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
				window.screen.orientation.lock('landscape').catch(() => {
					// サポート外や未許可ブラウザでは静かにスルー
				});
			}
		}

		function handleFirstUserInteraction() {
			sound.unlock();
			tryLockScreenOrientation();
		}

		['touchstart', 'touchend', 'pointerdown', 'click'].forEach(evtType => {
			document.addEventListener(evtType, handleFirstUserInteraction, { once: true, passive: true });
		});

		window.addEventListener('resize', handleResizeAndLayout);
		window.addEventListener('orientationchange', handleResizeAndLayout);
		if (window.screen && window.screen.orientation) {
			window.screen.orientation.addEventListener('change', handleResizeAndLayout);
		}

		if (window.ResizeObserver) {
			const ro = new ResizeObserver(() => {
				enforcePanelAspectRatio();
			});
			const wrapperEl = document.querySelector('.scoreboard-wrapper');
			if (wrapperEl) ro.observe(wrapperEl);
		}

		// 初期描画実行 & リロード前の状態を復元
		handleResizeAndLayout();
		tryLockScreenOrientation();
		syncVoiceBtnUI();
		syncUIAndBoard({ animate: false });
		if ((state.pendingPhase === 'game_end' || state.pendingPhase === 'match_end') && state.pendingWinnerIdx !== -1) {
			showInboardBar(state.pendingPhase, state.pendingWinnerIdx);
		}
	</script>
</body>
</html>
