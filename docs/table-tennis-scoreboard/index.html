<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>卓球スコアボード - Table Tennis Scoreboard</title>

	<!-- PWA & Mobile Web App Meta Tags -->
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#050507">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="卓球スコア">
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
	<link rel="apple-touch-icon" href="icon-192.png">

	<style>
		:root {
			--bg-black: #050507;
			--card-bg-top: #202228;
			--card-bg-bottom: #181a1f;
			--card-border: rgba(255, 255, 255, 0.11);
			--text-white: #ffffff;
			--text-yellow: #facc15;
			--serve-red: #dc2626;
			--accent-blue: #2563eb;
			--accent-gold: #facc15;

			/* Safe Area CSS Variables (Device-Native Insets) */
			--safe-top: env(safe-area-inset-top, 0px);
			--safe-bottom: env(safe-area-inset-bottom, 0px);
			--safe-left: env(safe-area-inset-left, 0px);
			--safe-right: env(safe-area-inset-right, 0px);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
		}

		html, body {
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			background-color: var(--bg-black);
			color: var(--text-white);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', Meiryo, sans-serif;
			touch-action: manipulation;
		}

		/* ルートビューポートコンテナ (全画面フィット・回転処理は完全撤廃しネイティブ表示) */
		#app-viewport-root {
			position: relative;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			container-type: size;
			container-name: viewport;
		}

		#app {
			position: relative;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding-top: max(4px, var(--safe-top));
			padding-bottom: max(6px, var(--safe-bottom));
			padding-left: max(8px, var(--safe-left));
			padding-right: max(8px, var(--safe-right));
		}

		/* =========================================================
		   1. Top Header Area:
		      Left Player Name | Subtle Center Change-Court Button | Right Player Name
		      (Placed directly above the Scoreboard Panels inside .scoreboard-wrapper)
		========================================================= */
		.top-header-bar {
			position: relative;
			z-index: 20;
			display: grid;
			grid-template-columns: 34fr 14fr 14fr 34fr;
			align-items: center;
			gap: clamp(4px, 1.5vw, 20px);
			flex-shrink: 0;
			width: 100%;
			margin: 0 auto;
		}

		.player-header-col {
			display: flex;
			align-items: center;
			justify-content: center;
			min-width: 0;
			width: 100%;
		}

		.player-header-col.left { grid-column: 1; }
		.player-header-col.right { grid-column: 4; }

		.player-name-input {
			background: transparent;
			border: 2px solid transparent;
			color: #ffffff;
			font-size: clamp(0.92rem, 2.2vw, 1.3rem);
			font-weight: 900;
			text-align: center;
			width: 100%;
			max-width: 100%;
			height: clamp(24px, 4.4vh, 32px);
			padding: 1px 3px;
			border-radius: 8px;
			outline: none;
			transition: border-color 0.2s, background-color 0.2s;
			user-select: text;
			-webkit-user-select: text;
			touch-action: manipulation;
		}

		.player-name-input:focus {
			background: rgba(255, 255, 255, 0.12);
			border-color: var(--accent-blue);
		}

		/* Subtle, low-profile Change-Court ("⇄") Button */
		.swap-top-btn {
			grid-column: 2 / 4;
			justify-self: center;
			min-width: 32px;
			height: clamp(22px, 3.8vh, 28px);
			padding: 0 6px;
			background: transparent;
			border: none;
			border-radius: 8px;
			color: rgba(255, 255, 255, 0.35);
			font-size: clamp(0.85rem, 1.6vw, 1.1rem);
			font-weight: 600;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: color 0.15s, background 0.15s, transform 0.1s;
		}

		.swap-top-btn:hover {
			color: rgba(255, 255, 255, 0.7);
			background: rgba(255, 255, 255, 0.06);
		}

		.swap-top-btn:active {
			transform: scale(0.92);
			color: #ffffff;
			background: rgba(255, 255, 255, 0.12);
		}

		/* =========================================================
		   2. Pure CSS Scoreboard Stage
		      - Always fills full horizontal width up to portrait-ratio constraint
		      - Height fills available viewport while maintaining vertical panel ratio (>= 4:3)
		      - Player Names + Change-Court Button sit immediately above Score Panels
		========================================================= */
		.scoreboard-wrapper {
			flex: 1;
			min-height: 0;
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 2px 0;
		}

		/* スコアボード全体（ヘッダー＋ステージ）を包むプロポーション制御コンテナ */
		.scoreboard-content-box {
			width: 100%;
			max-width: 1400px;
			height: 100%;
			max-height: 840px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: clamp(2px, 0.6vh, 6px);
			margin: 0 auto;
			transition: max-width 0.15s ease-out;
		}

		.scoreboard-stage {
			width: 100%;
			flex: 1;
			min-height: 0;
			display: grid;
			grid-template-columns: 34fr 14fr 14fr 34fr;
			align-items: stretch;
			gap: clamp(5px, 1.8vw, 24px);
			perspective: 1400px;
			transition: transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1);
		}

		.scoreboard-stage.swapping {
			transform: rotateY(16deg) scale(0.97);
		}

		/* Point Column: Serve Bar matched to Point Panel width + Point Card */
		.point-col {
			grid-row: 1;
			height: 100%;
			width: 100%;
			min-width: 0;
			display: flex;
			flex-direction: column;
			gap: clamp(4px, 0.9vh, 8px);
		}

		.point-col.left { grid-column: 1; }
		.point-col.right { grid-column: 4; }

		/* Serve Marker Bar directly above the Point Panel (100% matched to Point Panel width) */
		.serve-panel-bar {
			width: 100%;
			height: clamp(8px, 1.4vh, 14px);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.1);
			border: 1.5px solid rgba(255, 255, 255, 0.22);
			flex-shrink: 0;
			cursor: pointer;
			transition: background 0.22s, box-shadow 0.22s, border-color 0.22s, transform 0.15s;
		}

		.serve-panel-bar:active {
			transform: scale(0.98);
		}

		.serve-panel-bar.active {
			background: var(--serve-red);
			border-color: #fca5a5;
			box-shadow: 0 0 18px rgba(220, 38, 38, 0.95);
		}

		/* Center Columns Wrapper (Spans columns 2 & 3 so we can place the Start Button / Elapsed Time in the lower empty area) */
		.center-cols-area {
			grid-column: 2 / 4;
			grid-row: 1;
			height: 100%;
			width: 100%;
			min-width: 0;
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			padding-top: calc(clamp(8px, 1.4vh, 14px) + clamp(4px, 0.9vh, 8px));
		}

		.game-panels-pair {
			width: 100%;
			min-width: 0;
			height: 62%;
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: clamp(5px, 1.8vw, 24px);
		}

		.game-subcol {
			height: 100%;
			width: 100%;
			min-width: 0;
			display: flex;
			flex-direction: column;
			align-items: stretch;
			justify-content: flex-start;
			gap: clamp(4px, 1.4vh, 14px);
		}

		/* Lower empty area under the Game Panels & Dots: Houses "START" button or subtle elapsed timer (mm:ss) */
		.center-lower-slot {
			flex: 1;
			width: 100%;
			min-width: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding-top: 4px;
		}

		.start-match-btn {
			padding: clamp(6px, 1.5vh, 12px) clamp(10px, 2.5vw, 24px);
			max-width: 100%;
			border-radius: 999px;
			background: rgba(37, 99, 235, 0.22);
			border: 2px solid rgba(96, 165, 250, 0.65);
			color: #eff6ff;
			font-size: clamp(0.78rem, 2vw, 1.2rem);
			font-weight: 900;
			letter-spacing: 0.04em;
			cursor: pointer;
			box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
			transition: transform 0.12s, background 0.15s, border-color 0.15s;
			white-space: nowrap;
		}

		.start-match-btn:hover {
			background: rgba(37, 99, 235, 0.35);
			border-color: #93c5fd;
		}

		.start-match-btn:active {
			transform: scale(0.94);
		}

		.match-elapsed-timer {
			font-size: clamp(1.05rem, 3.4vw, 2.25rem);
			font-weight: 800;
			color: rgba(255, 255, 255, 0.48);
			font-variant-numeric: tabular-nums;
			letter-spacing: 0.06em;
			display: none;
		}

		/* --- Clean Seamless Scoreboard Card Unit --- */
		.flip-card {
			position: relative;
			width: 100%;
			min-width: 0;
			container-type: size;
			border-radius: clamp(12px, 2vw, 24px);
			background: linear-gradient(180deg, #20232c 0%, #15171d 100%);
			border: 1.5px solid rgba(255, 255, 255, 0.12);
			box-shadow:
				0 14px 34px rgba(0, 0, 0, 0.8),
				inset 0 1px 0 rgba(255, 255, 255, 0.14);
			cursor: pointer;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: box-shadow 0.15s, transform 0.1s, border-color 0.2s;
			--digit-size: clamp(5rem, min(28vw, 54vh), 26rem);
			--digit-scale-y: 1;
			--digit-color: #ffffff;
		}

		.flip-card.point-card {
			flex: 1;
			min-height: 0;
			--digit-size: clamp(5rem, min(28vw, 54vh), 26rem);
			--digit-scale-y: 1;
		}

		.flip-card.game-card {
			flex: 1;
			min-height: 0;
			border-radius: clamp(10px, 1.5vw, 18px);
			--digit-size: clamp(2.8rem, min(12.5vw, 30vh), 14rem);
			--digit-scale-y: 1;
		}

		/* Container query units */
		@supports (font-size: 1cqh) {
			.flip-card.point-card {
				--digit-size: min(84cqh, 88cqw);
			}
			.flip-card.game-card {
				--digit-size: min(84cqh, 88cqw);
			}
		}

		/* 10+ Points turns digit yellow */
		.flip-card.yellow-digits {
			--digit-color: var(--text-yellow);
		}

		/* Visual feedback while pressing down on a panel */
		.flip-card.pressing {
			box-shadow:
				0 0 0 4px rgba(59, 130, 246, 0.85),
				0 14px 34px rgba(0, 0, 0, 0.85);
			border-color: rgba(96, 165, 250, 0.6);
		}

		/* 一体型カードの数字要素（常に垂直・水平の完全中央配置） */
		.card-digit {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
			margin: 0;
			font-size: var(--digit-size);
			font-weight: 800;
			line-height: 1;
			color: var(--digit-color);
			font-variant-numeric: tabular-nums;
			letter-spacing: -0.04em;
			--digit-scale-x: 1;
			transform-origin: center center;
			transform: scale(var(--digit-scale-x), var(--digit-scale-y));
			text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
			will-change: transform, opacity;
			pointer-events: none;
		}

		/* 10以上の2桁表示時は縦幅を保持したまま横幅のみ圧縮 */
		.card-digit.two-digits-text {
			--digit-scale-x: 0.75;
			letter-spacing: -0.06em;
		}

		/* 高速・高視認性 スライド＆スナップ トランジション */
		@keyframes scoreSlideDownIn {
			0% {
				transform: translateY(-28%) scale(var(--digit-scale-x), var(--digit-scale-y));
				opacity: 0.15;
			}
			70% {
				transform: translateY(3%) scale(var(--digit-scale-x), var(--digit-scale-y));
				opacity: 1;
			}
			100% {
				transform: translateY(0%) scale(var(--digit-scale-x), var(--digit-scale-y));
				opacity: 1;
			}
		}

		@keyframes scoreSlideUpIn {
			0% {
				transform: translateY(28%) scale(var(--digit-scale-x), var(--digit-scale-y));
				opacity: 0.15;
			}
			70% {
				transform: translateY(-3%) scale(var(--digit-scale-x), var(--digit-scale-y));
				opacity: 1;
			}
			100% {
				transform: translateY(0%) scale(var(--digit-scale-x), var(--digit-scale-y));
				opacity: 1;
			}
		}

		@keyframes scoreCardPulse {
			0% { transform: scale(0.965); }
			60% { transform: scale(1.012); }
			100% { transform: scale(1); }
		}

		.flip-card.anim-slide-down .card-digit {
			animation: scoreSlideDownIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
		}

		.flip-card.anim-slide-up .card-digit {
			animation: scoreSlideUpIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
		}

		.flip-card.pulse-anim {
			animation: scoreCardPulse 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
		}

		/* --- Won-Game Circles ("〇〇〇") matched to the Game Card's width --- */
		.game-dots-bar {
			width: 100%;
			min-width: 0;
			container-type: inline-size;
			display: flex;
			align-items: center;
			justify-content: space-evenly;
			gap: clamp(2px, 0.5vw, 5px);
			padding: 2px 0;
			flex-shrink: 0;
		}

		.game-dot {
			flex: 0 1 auto;
			width: clamp(7px, 2.6vw, 28px);
			aspect-ratio: 1 / 1;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.12);
			border: clamp(1px, 0.18vw, 1.8px) solid rgba(255, 255, 255, 0.5);
			transition: background 0.22s, transform 0.22s, box-shadow 0.22s, border-color 0.22s;
		}

		.game-dots-bar[data-count="4"] .game-dot {
			width: clamp(6px, 2.2vw, 23px);
		}

		@supports (width: 1cqw) {
			.game-dot {
				width: min(26cqw, 28px);
				border-width: clamp(1px, 1.5cqw, 1.8px);
			}
			.game-dots-bar[data-count="4"] .game-dot {
				width: min(20cqw, 23px);
			}
		}

		.game-dot.won {
			background: #ffffff;
			border-color: #ffffff;
			box-shadow: 0 0 14px rgba(255, 255, 255, 0.9);
			transform: scale(1.08);
		}

		/* =========================================================
		   3. Game/Match Finished Overlay & Action Bar
		========================================================= */
		.inboard-overlay {
			position: fixed;
			inset: 0;
			z-index: 65;
			background: rgba(0, 0, 0, 0.15);
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			align-items: center;
			padding-bottom: max(clamp(76px, 14vh, 114px), calc(env(safe-area-inset-bottom, 0px) + 76px));
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.22s ease;
		}

		.inboard-overlay.active {
			opacity: 1;
			pointer-events: auto;
		}

		.inboard-action-bar {
			width: min(94vw, 680px);
			background: rgba(15, 23, 42, 0.96);
			border: 3px solid var(--accent-gold);
			border-radius: 20px;
			padding: clamp(12px, 2.2vh, 18px) clamp(14px, 3vw, 24px);
			box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
			transform: translateY(24px);
			transition: transform 0.22s ease;
		}

		.inboard-overlay.active .inboard-action-bar {
			transform: translateY(0);
		}

		.inboard-title {
			font-size: clamp(1.15rem, 2.8vw, 1.45rem);
			font-weight: 900;
			color: #fef08a;
			text-align: center;
			overflow-wrap: anywhere;
			word-break: break-word;
		}

		.inboard-btn-row {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 10px;
			width: 100%;
		}

		.inboard-btn {
			flex: 1 1 180px;
			min-height: 54px;
			padding: 12px 18px;
			border-radius: 14px;
			border: 2px solid rgba(255, 255, 255, 0.22);
			font-size: clamp(1.05rem, 2.4vw, 1.25rem);
			font-weight: 900;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			transition: transform 0.1s;
		}

		.inboard-btn:active {
			transform: scale(0.96);
		}

		.inboard-btn.primary {
			background: var(--accent-blue);
			border-color: #93c5fd;
			color: #ffffff;
		}

		.inboard-btn.gold {
			background: var(--accent-gold);
			border-color: #fef08a;
			color: #0f172a;
		}

		.inboard-btn.secondary {
			background: #334155;
			color: #f8fafc;
		}

		/* =========================================================
		   4. Bottom Circular Controls
		========================================================= */
		.bottom-controls-layer {
			position: relative;
			z-index: 25;
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: 100%;
			max-width: 1400px;
			margin: 0 auto;
			padding-top: 1px;
			pointer-events: none;
		}

		.left-controls,
		.center-controls,
		.right-controls {
			display: flex;
			align-items: center;
			gap: clamp(4px, 1.5vw, 10px);
			pointer-events: auto;
		}

		.circle-btn {
			aspect-ratio: 1 / 1;
			width: clamp(38px, min(10.2vw, 7.8vh), 48px);
			height: clamp(38px, min(10.2vw, 7.8vh), 48px);
			flex-shrink: 0;
			border-radius: 50%;
			background: rgba(26, 28, 35, 0.95);
			border: 1.5px solid rgba(255, 255, 255, 0.24);
			color: #ffffff;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
			transition: transform 0.12s, background 0.15s, border-color 0.15s;
			padding: 2px 1px 3px 1px;
			overflow: hidden;
			box-sizing: border-box;
			container-type: size;
		}

		.circle-btn:active {
			transform: scale(0.92);
			background: rgba(48, 52, 64, 0.98);
		}

		.circle-btn.off-state {
			color: #6b7280;
			border-color: rgba(255, 255, 255, 0.1);
		}

		.circle-btn svg {
			width: 38cqw;
			height: 38cqw;
			max-width: 20px;
			max-height: 20px;
			stroke: currentColor;
			fill: none;
			stroke-width: 2.3;
			stroke-linecap: round;
			stroke-linejoin: round;
			flex-shrink: 0;
		}

		#format-main-label {
			font-size: 36cqw !important;
			line-height: 1;
			margin-top: 1px;
		}

		.btn-subtext {
			font-size: 18cqw;
			font-weight: 900;
			letter-spacing: 0.01em;
			line-height: 1;
			margin-top: 1.5px;
			white-space: nowrap;
			flex-shrink: 0;
			text-align: center;
		}

		/* =========================================================
		   5. Toast Notification Banner
		========================================================= */
		.toast-banner {
			position: fixed;
			top: max(16px, calc(var(--safe-top) + 14px));
			left: 50%;
			transform: translateX(-50%) translateY(-25px);
			z-index: 95;
			background: rgba(15, 23, 42, 0.96);
			border: 2.5px solid var(--accent-gold);
			color: #ffffff;
			padding: 12px 26px;
			border-radius: 999px;
			font-weight: 900;
			font-size: clamp(1.05rem, 2.5vw, 1.35rem);

		/* =========================================================

		.overlay-screen {
			position: fixed;
			inset: 0;
			height: 100%;
			height: 100dvh;
			z-index: 75;
			background: #ede6d4;
			color: #1e293b;
			display: flex;
			flex-direction: column;
			opacity: 0;
			pointer-events: none;
			transform: translateY(15px);
			transition: opacity 0.22s ease, transform 0.22s ease;
			touch-action: pan-y;
		}

		.overlay-screen.active {
			opacity: 1;
			pointer-events: auto;
			transform: translateY(0);
		}

		.screen-topbar {
			background: #e4dcbf;
			color: #1e293b;
			position: relative;
			display: grid;
			grid-template-columns: 44px 1fr auto;
			align-items: center;
			padding-top: max(8px, calc(var(--safe-top) + 6px));
			padding-bottom: 8px;
			padding-left: max(8px, calc(var(--safe-left) + 8px));
			padding-right: max(10px, calc(var(--safe-right) + 10px));
			min-height: 50px;
			border-bottom: 1.5px solid rgba(0, 0, 0, 0.08);
			box-shadow: 0 4px 14px rgba(160, 145, 120, 0.25);
			flex-shrink: 0;
			z-index: 10;
			gap: 4px;
		}

		.screen-back-btn {
			background: transparent;
			border: none;
			color: #1e293b;
			padding: 6px 10px;
			min-width: 44px;
			min-height: 44px;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			transition: opacity 0.15s, transform 0.1s, background 0.15s;
			border-radius: 999px;
			-webkit-tap-highlight-color: transparent;
			flex-shrink: 0;
			z-index: 2;
		}

		.screen-back-btn:hover {
			opacity: 0.8;
			background: rgba(0, 0, 0, 0.05);
		}

		.screen-back-btn:active {
			transform: scale(0.9);
			background: rgba(0, 0, 0, 0.1);
		}

		.screen-back-btn svg {
			width: 28px;
			height: 28px;
			stroke: currentColor;
			stroke-width: 2.6;
			stroke-linecap: round;
			stroke-linejoin: round;
			fill: none;
			display: block;
		}

		.screen-topbar-actions {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: clamp(3px, 1.2vw, 6px);
			z-index: 2;
			flex-shrink: 0;
		}

		.screen-action-btn {
			background: #2563eb;
			border: 1px solid #1d4ed8;
			color: #ffffff;
			border-radius: 7px;
			min-height: 28px;
			padding: 3px clamp(6px, 1.5vw, 10px);
			font-size: clamp(0.7rem, 2vw, 0.82rem);

			cursor: pointer;
			box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
			transition: background 0.15s, transform 0.1s;
			white-space: nowrap;
			flex-shrink: 0;
		}

		.screen-action-btn:active {
			transform: scale(0.95);
			background: #1d4ed8;
		}

		.screen-action-btn:disabled {
			opacity: 0.35;
			pointer-events: none;
		}

		.screen-danger-btn {
			background: #dc2626;
			border: 1px solid #b91c1c;
			color: #ffffff;
			border-radius: 7px;
			min-height: 28px;
			padding: 3px clamp(6px, 1.5vw, 10px);
			font-size: clamp(0.7rem, 2vw, 0.82rem);
			font-weight: 800;
			cursor: pointer;

			flex-shrink: 0;

		.screen-danger-btn:active {

			background: #b91c1c;
		}

		.screen-danger-btn:disabled {

		}

		/* =========================================================
		   7. Large Touch-Friendly Modal Dialog (Zero Vertical Scrollbar)
		========================================================= */
		.modal-backdrop {
			position: fixed;
			inset: 0;
			z-index: 90;
			background: rgba(0, 0, 0, 0.82);
			backdrop-filter: blur(6px);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 8px;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.2s ease;
		}

		.modal-backdrop.active {
			opacity: 1;
			pointer-events: auto;
		}

		.modal-card {
			background: #181b23;
			border: 2px solid rgba(255, 255, 255, 0.25);
			border-radius: 18px;
			max-width: 540px;
			width: min(calc(100% - 32px), 540px);
			max-height: min(calc(100% - 16px), 94%);
			overflow-y: auto;
			overscroll-behavior: contain;
			padding: clamp(10px, 2.5%, 16px) clamp(14px, 3.5%, 22px);
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
			text-align: center;
			transform: scale(0.95);
			transform-origin: center center;
			transition: transform 0.2s ease;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		.modal-backdrop.active .modal-card {
			transform: scale(var(--modal-scale, 1));
		}

		.modal-title {
			font-size: clamp(1.08rem, 2.4vw, 1.35rem);
			font-weight: 900;
			margin-bottom: 4px;
			color: #ffffff;
			line-height: 1.2;
		}

		.modal-desc {
			font-size: clamp(0.82rem, 1.8vw, 0.96rem);
			color: #cbd5e1;
			line-height: 1.35;
			margin-bottom: 10px;
			white-space: pre-line;
		}

		.modal-actions {
			width: 100%;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
			gap: 8px;
		}

		.modal-actions.format-grid {
			grid-template-columns: repeat(4, 1fr);
		}

		.modal-actions.two-cols-row {
			grid-template-columns: 1fr 1fr;
		}

		@media (max-width: 480px) {
			.modal-actions.two-cols-row {
				grid-template-columns: 1fr;
			}
		}

		.modal-btn {
			width: 100%;
			min-width: 0;
			min-height: clamp(38px, 6.5vh, 46px);
			padding: 8px 12px;
			border-radius: 12px;
			border: 2px solid rgba(255, 255, 255, 0.2);
			font-size: clamp(0.82rem, 2.4vw, 1.02rem);
			font-weight: 900;
			cursor: pointer;
			transition: transform 0.1s;
			display: flex;
			align-items: center;
			justify-content: center;
			white-space: nowrap;
			text-overflow: ellipsis;
		}

		.modal-btn:active {
			transform: scale(0.97);
		}

		.modal-btn:disabled {
			opacity: 0.35;
			pointer-events: none;
			cursor: not-allowed;
		}

		.modal-btn.primary {
			background: var(--accent-blue);
			border-color: #93c5fd;
			color: #ffffff;
		}

		.modal-btn.danger {
			background: #dc2626;
			border-color: #fca5a5;
			color: #ffffff;
		}

		.modal-btn.secondary {
			background: #2d323e;
			color: #f8fafc;
		}

		.modal-btn.cancel-full {
			grid-column: 1 / -1;
			background: #1f242d;
			border-color: rgba(255, 255, 255, 0.3);
			color: #cbd5e1;
		}

		/* マッチ形式設定モーダル専用スタイル */
		.format-modal-content {
			width: 100%;
			display: flex;
			flex-direction: column;
			gap: 12px;
			margin-bottom: 12px;
		}

		.format-setting-group {
			width: 100%;
			text-align: left;
		}

		.format-setting-label {
			font-size: clamp(0.78rem, 1.8vw, 0.88rem);
			font-weight: 800;
			color: #94a3b8;
			margin-bottom: 6px;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.format-btn-grid {
			display: grid;
			gap: 6px;
			width: 100%;
		}

		.format-btn-grid.cols-4 {
			grid-template-columns: repeat(4, 1fr);
		}

		.format-btn-grid.cols-5 {
			grid-template-columns: repeat(5, 1fr);
		}

		.format-choice-btn {
			width: 100%;
			min-width: 0;
			min-height: clamp(36px, 5.2vh, 42px);
			padding: 6px 4px;
			border-radius: 8px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			background: rgba(255, 255, 255, 0.04);
			color: #94a3b8;
			font-size: clamp(0.82rem, 2vw, 0.94rem);
			font-weight: 700;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.15s ease;
			user-select: none;
			-webkit-user-select: none;
			white-space: nowrap;
		}

		.format-choice-btn:active {
			transform: scale(0.98);
		}

		/* 選択状態: アクション決定ボタン（青ベタ塗り）との混同を防ぐため、シアン枠線＋薄いtint背景でセレクト状態を明確化 */
		.format-choice-btn.active {
			background: rgba(56, 189, 248, 0.14);
			border: 2px solid #38bdf8;
			box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.3);
			color: #ffffff;
			font-weight: 900;
		}

		.format-choice-btn:disabled {
			opacity: 0.3;
			cursor: not-allowed;
			border-color: rgba(255, 255, 255, 0.06);
			pointer-events: none;
		}

		.meta-format-badge {
			background: #e0f2fe;
			border: 1px solid #7dd3fc;
			color: #0369a1;
			padding: 2px 8px;
			border-radius: 9999px;
			font-size: clamp(0.72rem, 1.4vw, 0.82rem);
			font-weight: 800;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<div id="app-viewport-root">
	<div id="app">
		<!-- Pure CSS 3D Split-Flap Scoreboard Stage (Always Landscape-Proportioned!)
		     Top Header Area (Player Names + Subtle Change-Court Button) sits directly above the Score Panels -->
		<div class="scoreboard-wrapper">
			<div id="scoreboard-content-box" class="scoreboard-content-box">
				<header class="top-header-bar">
					<div class="player-header-col left">
						<input id="left-name-input" class="player-name-input" type="text" value="Player1" maxlength="16" aria-label="Left Player Name">
					</div>

					<button id="btn-swap-top" class="swap-top-btn" title="チェンジコート (左右入れ替え)">
						⇄
					</button>

					<div class="player-header-col right">
						<input id="right-name-input" class="player-name-input" type="text" value="Player2" maxlength="16" aria-label="Right Player Name">
					</div>
				</header>

				<main id="scoreboard-stage" class="scoreboard-stage">
					<!-- Left Point Column: Serve Bar (100% matched to Point Panel width) + Point Panel -->
					<div class="point-col left">
						<div id="left-serve-bar" class="serve-panel-bar active" title="タップしてサーブ権を切り替え"></div>
						<div id="card-left-point" class="flip-card point-card" data-role="point" data-side="left">
							<div class="card-digit">0</div>
						</div>
					</div>

					<!-- Center Columns (Spans cols 2 & 3): Left/Right Game Panels + Won-Game Dots + Lower Slot (Start Match Button / Elapsed Time) -->
					<div class="center-cols-area">
						<div class="game-panels-pair">
							<div class="game-subcol">
								<div id="card-left-game" class="flip-card game-card" data-role="game" data-side="left">
									<div class="card-digit">0</div>
								</div>
								<div id="left-dots-bar" class="game-dots-bar"></div>
							</div>

							<div class="game-subcol">
								<div id="card-right-game" class="flip-card game-card" data-role="game" data-side="right">
									<div class="card-digit">0</div>
								</div>
								<div id="right-dots-bar" class="game-dots-bar"></div>
							</div>
						</div>

						<!-- Lower empty area under Game Panels: Displays "START" button before match starts, and elapsed "mm:ss" timer once started -->
						<div class="center-lower-slot">
							<button id="btn-start-match" class="start-match-btn" title="試合を開始してタイマーをスタート">
								START
							</button>
							<div id="match-elapsed-timer" class="match-elapsed-timer" aria-label="経過時間">
								00:00
							</div>
						</div>
					</div>

					<!-- Right Point Column: Serve Bar (100% matched to Point Panel width) + Point Panel -->
					<div class="point-col right">
						<div id="right-serve-bar" class="serve-panel-bar" title="タップしてサーブ権を切り替え"></div>
						<div id="card-right-point" class="flip-card point-card" data-role="point" data-side="right">
							<div class="card-digit">0</div>
						</div>
					</div>
				</main>
			</div>
		</div>

		<!-- Game/Match Finished Overlay (Blocks background buttons while keeping Scoreboard 100% visible!) -->
		<div id="inboard-overlay" class="inboard-overlay" role="dialog" aria-modal="true" aria-live="polite">
			<div class="inboard-action-bar">
				<div id="inboard-title" class="inboard-title">Player1 がこのゲームを獲得！</div>
				<div id="inboard-btn-row" class="inboard-btn-row"></div>
			</div>
		</div>

		<!-- Bottom Floating Circular Controls -->
		<footer class="bottom-controls-layer">
			<!-- Bottom Left: Undo (-1) & Match Format -->
			<div class="left-controls">
				<button id="btn-undo" class="circle-btn" title="直前の操作を1つ戻す (Undo)">
					<svg viewBox="0 0 24 24">
						<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
						<path d="M3 3v5h5"/>
					</svg>
					<span class="btn-subtext">UNDO</span>
				</button>

				<button id="btn-match-format" class="circle-btn" title="マッチ形式の設定 (ゲーム数・デュース上限)">
					<span style="font-size:clamp(1.05rem, 2.2vw, 1.25rem); font-weight:900; line-height:1;" id="format-main-label">5G</span>
					<span class="btn-subtext" id="format-sub-label">MATCH</span>
				</button>
			</div>

			<!-- Bottom Center: Reset (×) -->
			<div class="center-controls">
				<button id="btn-reset" class="circle-btn" title="ゲームまたはマッチをリセット">
					<svg viewBox="0 0 24 24">
						<line x1="18" y1="6" x2="6" y2="18"/>
						<line x1="6" y1="6" x2="18" y2="18"/>
					</svg>
					<span class="btn-subtext">RESET</span>
				</button>
			</div>

			<!-- Bottom Right: Current Match Score History Chart, Match Result Table, Voice Toggle -->
			<div class="right-controls">
				<button id="btn-history" class="circle-btn" title="現在のマッチのスコア推移を表示">
					<svg viewBox="0 0 24 24">
						<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
					</svg>
					<span class="btn-subtext">推移</span>
				</button>

				<button id="btn-result" class="circle-btn" title="試合結果履歴を表示">
					<svg viewBox="0 0 24 24">
						<rect x="3" y="3" width="18" height="18" rx="2"/>
						<line x1="3" y1="9" x2="21" y2="9"/>
						<line x1="9" y1="21" x2="9" y2="9"/>
						<line x1="15" y1="21" x2="15" y2="9"/>
					</svg>
					<span class="btn-subtext">結果</span>
				</button>

				<button id="btn-voice" class="circle-btn" title="英語音声読み上げ ON/OFF">
					<svg id="voice-svg-on" viewBox="0 0 24 24">
						<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
						<path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
						<path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
					</svg>
					<svg id="voice-svg-off" viewBox="0 0 24 24" style="display:none;">
						<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
						<line x1="23" y1="9" x2="17" y2="15"/>
						<line x1="17" y1="9" x2="23" y2="15"/>
					</svg>
					<span class="btn-subtext" id="voice-state-text">VOICE</span>
				</button>
			</div>
		</footer>
	</div>

	<!-- Floating Toast Notification -->
	<div id="toast-banner" class="toast-banner">Change Ends</div>

	<!-- =========================================================
	     1) 試合結果ビュー (Multiple Completed Matches History + Export/Import + Clear Results Button)
	========================================================= -->
	<section id="result-view" class="overlay-screen" aria-label="試合結果">
		<header class="screen-topbar">
			<button id="btn-result-close" class="screen-back-btn" title="スコアボードに戻る" aria-label="戻る">
				<svg viewBox="0 0 24 24">
					<polyline points="15 18 9 12 15 6" />
				</svg>
			</button>
			<div class="screen-title-center">試合結果</div>
			<div class="screen-topbar-actions">
				<button id="btn-data-manage" class="screen-action-btn" title="試合結果データのエクスポート・インポート">データ管理</button>
				<button id="btn-clear-results" class="screen-danger-btn">全て削除</button>
				<input type="file" id="input-import-results" accept=".json,application/json,text/plain" style="display:none;" />
			</div>
		</header>
		<div class="screen-body">
			<div id="results-list-container" class="results-list-container"></div>
		</div>
	</section>

	<!-- =========================================================
	     2) スコア推移グラフビュー (Displays Current Match or Selected Past Match)
	========================================================= -->
	<section id="history-view" class="overlay-screen" aria-label="スコア推移グラフ">
		<header class="screen-topbar history-topbar">
			<button id="btn-history-close" class="screen-back-btn" title="戻る" aria-label="戻る">
				<svg viewBox="0 0 24 24">
					<polyline points="15 18 9 12 15 6" />
				</svg>
			</button>
			<div class="history-header-summary">
				<span id="hist-name-0" class="history-header-name">Player1</span>
				<span id="hist-games-score" class="score-pill">0 - 0</span>
				<span id="hist-name-1" class="history-header-name">Player2</span>
			</div>
			<div style="width:44px;"></div>
		</header>
		<div class="screen-body">
			<div id="history-content" class="history-list-container"></div>
		</div>
	</section>

	<!-- =========================================================
	     Large Touch Modal (For Format Selection, Reset Confirm & Clear Results Confirm)
	========================================================= -->
	<div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true">
		<div class="modal-card">
			<h2 id="modal-title" class="modal-title">タイトル</h2>
			<p id="modal-desc" class="modal-desc">説明</p>
			<div id="modal-body" class="modal-body" style="display:none; width:100%;"></div>
			<div id="modal-actions" class="modal-actions"></div>
		</div>
	</div>
	</div><!-- /#app-viewport-root -->

	<script>
		// ============================================================================
		// 1. アプリケーション状態管理 & localStorage 永続化 (安全フォールバック付き)
		// ============================================================================
		const STORAGE_KEY = 'tt_scoreboard_match_records_v1';
		const ACTIVE_STATE_STORAGE_KEY = 'tt_scoreboard_active_state_v1';

		const state = {
			bestOf: 5, // 1, 3, 5, 7
			deuceLimit: null, // null (上限なし・公式ルール) | 11 | 12 | 13 | 14 | 15
			teams: [
				{ id: 0, name: 'Player1', points: 0, games: 0 },
				{ id: 1, name: 'Player2', points: 0, games: 0 }
			],
			leftTeamIdx: 0,
			rightTeamIdx: 1,
			initialServerTeamIdx: 0,
			decidingSwapped: false,
			voiceEnabled: true,
			modalOpen: false,
			autoSwapPending: false,
			pendingPhase: 'none', // 'none' | 'game_end' | 'match_end'
			pendingWinnerIdx: -1,
			// 試合開始状態 & 時刻管理
			matchStarted: false,
			matchStartTime: null, // timestamp (ms)
			matchEndTime: null,   // timestamp (ms)
			currentSavedMatchId: null, // マッチ終了時に保存されたレコードID（Undoで戻した際に取り消せるように保持）
			// 現在のマッチの操作履歴・ゲーム履歴
			actionUndoStack: [],
			currentGameRallyLog: [],
			completedGamesHistory: [],
			// 過去の全マッチ結果リスト (新しい順)
			matchRecords: [],
			// 試合結果画面の日付グループ開閉状態マップ ({ 'YYYY/MM/DD': boolean })
			resultDateOpenMap: {},
			// スコア推移画面の遷移元 ('scoreboard' | 'results')
			historyReturnTarget: 'scoreboard'
		};

		// localStorage 読み込み (アクセス不可環境でもエラーにしない)
		function loadMatchRecordsFromStorage() {
			try {
				const raw = window.localStorage.getItem(STORAGE_KEY);
				if (!raw) return;
				const parsed = JSON.parse(raw);
				if (Array.isArray(parsed)) {
					state.matchRecords = parsed;
				}
			} catch (e) {
				// localStorage unavailable or blocked (private browsing, file:// restriction, etc.)
			}
		}

		// localStorage 保存 (アクセス不可環境でもエラーにしない)
		function saveMatchRecordsToStorage() {
			try {
				window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state.matchRecords));
			} catch (e) {
				// Ignore storage errors gracefully
			}
		}

		// 進行中の試合＆推移データを localStorage から復元 (リロード・誤終了対策)
		function loadActiveMatchFromStorage() {
			try {
				const raw = window.localStorage.getItem(ACTIVE_STATE_STORAGE_KEY);
				if (!raw) return;
				const parsed = JSON.parse(raw);
				if (!parsed || typeof parsed !== 'object') return;

				if ([1, 3, 5, 7].includes(parsed.bestOf)) {
					state.bestOf = parsed.bestOf;
				}
				if ([11, 12, 13, 14, 15].includes(Number(parsed.deuceLimit))) {
					state.deuceLimit = Number(parsed.deuceLimit);
				} else {
					state.deuceLimit = null;
				}
				if (Array.isArray(parsed.teams) && parsed.teams.length === 2) {
					state.teams[0] = {
						id: 0,
						name: String(parsed.teams[0].name || 'Player1'),
						points: Math.max(0, Number(parsed.teams[0].points) || 0),
						games: Math.max(0, Number(parsed.teams[0].games) || 0)
					};
					state.teams[1] = {
						id: 1,
						name: String(parsed.teams[1].name || 'Player2'),
						points: Math.max(0, Number(parsed.teams[1].points) || 0),
						games: Math.max(0, Number(parsed.teams[1].games) || 0)
					};
				}
				if (parsed.leftTeamIdx === 0 || parsed.leftTeamIdx === 1) {
					state.leftTeamIdx = parsed.leftTeamIdx;
					state.rightTeamIdx = 1 - parsed.leftTeamIdx;
				}
				if (parsed.initialServerTeamIdx === 0 || parsed.initialServerTeamIdx === 1) {
					state.initialServerTeamIdx = parsed.initialServerTeamIdx;
				}
				state.decidingSwapped = Boolean(parsed.decidingSwapped);
				if (typeof parsed.voiceEnabled === 'boolean') {
					state.voiceEnabled = parsed.voiceEnabled;
				}
				if (['none', 'game_end', 'match_end'].includes(parsed.pendingPhase)) {
					state.pendingPhase = parsed.pendingPhase;
				}
				if (typeof parsed.pendingWinnerIdx === 'number') {
					state.pendingWinnerIdx = parsed.pendingWinnerIdx;
				}
				state.matchStarted = Boolean(parsed.matchStarted);
				state.matchStartTime = typeof parsed.matchStartTime === 'number' ? parsed.matchStartTime : null;
				state.matchEndTime = typeof parsed.matchEndTime === 'number' ? parsed.matchEndTime : null;
				state.currentSavedMatchId = typeof parsed.currentSavedMatchId === 'string' ? parsed.currentSavedMatchId : null;
				if (Array.isArray(parsed.actionUndoStack)) {
					state.actionUndoStack = parsed.actionUndoStack;
				}
				if (Array.isArray(parsed.currentGameRallyLog)) {
					state.currentGameRallyLog = parsed.currentGameRallyLog;
				}
				if (Array.isArray(parsed.completedGamesHistory)) {
					state.completedGamesHistory = parsed.completedGamesHistory;
				}
			} catch (e) {
				// Ignore storage errors gracefully
			}
		}

		// 進行中の試合＆推移データをリアルタイムで localStorage に保存
		function saveActiveMatchToStorage() {
			try {
				// 5点チェンジエンドの音声読み上げ待機中にリロードされた場合でもコート入れ替え状態が維持されるよう補正
				const effectiveLeftIdx = state.autoSwapPending ? state.rightTeamIdx : state.leftTeamIdx;
				const effectiveRightIdx = state.autoSwapPending ? state.leftTeamIdx : state.rightTeamIdx;
				const snapshot = {
					bestOf: state.bestOf,
					deuceLimit: state.deuceLimit,
					teams: state.teams,
					leftTeamIdx: effectiveLeftIdx,
					rightTeamIdx: effectiveRightIdx,
					initialServerTeamIdx: state.initialServerTeamIdx,
					decidingSwapped: state.decidingSwapped,
					voiceEnabled: state.voiceEnabled,
					pendingPhase: state.pendingPhase,
					pendingWinnerIdx: state.pendingWinnerIdx,
					matchStarted: state.matchStarted,
					matchStartTime: state.matchStartTime,
					matchEndTime: state.matchEndTime,
					currentSavedMatchId: state.currentSavedMatchId,
					actionUndoStack: state.actionUndoStack,
					currentGameRallyLog: state.currentGameRallyLog,
					completedGamesHistory: state.completedGamesHistory
				};
				window.localStorage.setItem(ACTIVE_STATE_STORAGE_KEY, JSON.stringify(snapshot));
			} catch (e) {
				// Ignore storage errors gracefully
			}
		}

		loadMatchRecordsFromStorage();
		loadActiveMatchFromStorage();

		let autoSwapTimerId = null;

		function cancelPendingAutoSwap() {
			if (autoSwapTimerId) {
				clearTimeout(autoSwapTimerId);
				autoSwapTimerId = null;
			}
			state.autoSwapPending = false;
		}

		function isInteractionLocked() {
			return (
				state.modalOpen ||
				state.autoSwapPending ||
				state.pendingPhase !== 'none' ||
				document.getElementById('history-view').classList.contains('active') ||
				document.getElementById('result-view').classList.contains('active')
			);
		}

		// ============================================================================
		// 2. 試合時間（経過時間 mm:ss）管理 & 日時フォーマットヘルパー
		// ============================================================================
		const btnStartMatchEl = document.getElementById('btn-start-match');
		const matchElapsedTimerEl = document.getElementById('match-elapsed-timer');

		function formatElapsedMMSS(ms) {
			const totalSec = Math.max(0, Math.floor(ms / 1000));
			const mm = Math.floor(totalSec / 60);
			const ss = totalSec % 60;
			return `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
		}

		function formatDateOnlyJP(ts) {
			if (!ts) return '日付不明';
			const d = new Date(ts);
			if (isNaN(d.getTime())) return '日付不明';
			const yyyy = d.getFullYear();
			const mo = String(d.getMonth() + 1).padStart(2, '0');
			const da = String(d.getDate()).padStart(2, '0');
			return `${yyyy}/${mo}/${da}`;
		}

		function formatDateTimeJP(ts) {
			if (!ts) return '-';
			const d = new Date(ts);
			if (isNaN(d.getTime())) return '-';
			const yyyy = d.getFullYear();
			const mo = String(d.getMonth() + 1).padStart(2, '0');
			const da = String(d.getDate()).padStart(2, '0');
			const hh = String(d.getHours()).padStart(2, '0');
			const mi = String(d.getMinutes()).padStart(2, '0');
			const ss = String(d.getSeconds()).padStart(2, '0');
			return `${yyyy}/${mo}/${da} ${hh}:${mi}:${ss}`;
		}

		const ENGLISH_NUMBERS = [
			'Love', 'One', 'Two', 'Three', 'Four', 'Five',
			'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven',
			'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen',

		function numberToEnglishWord(n) {
			if (n >= 0 && n < ENGLISH_NUMBERS.length) {
				return ENGLISH_NUMBERS[n];
			}
			return String(n);
		}

		const isIOS = (
			/iPad|iPhone|iPod/.test(navigator.userAgent) ||
			(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
		);

		class SoundSystem {
			constructor() {
				this.ctx = null;
				this.voices = [];
				this.unlocked = false;
				this.activeUtterances = new Set();

				if ('speechSynthesis' in window) {
					const loadVoices = () => {
						try {
							const list = window.speechSynthesis.getVoices();
							if (list && list.length > 0) {
								this.voices = list;
							}
						} catch (e) {}
					};
					loadVoices();
					window.speechSynthesis.onvoiceschanged = loadVoices;
				}
			}

			initContext() {
				if (!this.ctx) {
					const AudioCtx = window.AudioContext || window.webkitAudioContext;
					if (AudioCtx) this.ctx = new AudioCtx();
				}
				if (this.ctx && this.ctx.state === 'suspended') {
					this.ctx.resume().catch(() => {});
				}
			}

			// iOS/Safari 向け: ユーザー操作（タップ）時にオーディオと合成音声を確実にアンロック
			unlock() {
				this.initContext();
				if (!('speechSynthesis' in window)) return;

				try {
					if (window.speechSynthesis.paused) {
						window.speechSynthesis.resume();
					}
					if (!this.unlocked) {
						// iOS Safari ではユーザー操作コンテキスト内で一度空の発話を走らせておくことで
						// その後の発話がOSのセキュリティ制限でブロックされるのを防ぐ
						const dummyUtter = new SpeechSynthesisUtterance(' ');
						dummyUtter.volume = 0.01;
						dummyUtter.rate = 10;
						this.activeUtterances.add(dummyUtter);
						dummyUtter.onend = dummyUtter.onerror = () => {
							this.activeUtterances.delete(dummyUtter);
						};
						window.speechSynthesis.speak(dummyUtter);
						this.unlocked = true;
					}
				} catch (e) {}
			}

			playFlipSound(isUp = true) {
				try {
					this.initContext();
					if (!this.ctx) return;
					const now = this.ctx.currentTime;
					const osc = this.ctx.createOscillator();
					const gain = this.ctx.createGain();

					osc.type = 'triangle';
					osc.frequency.setValueAtTime(isUp ? 195 : 140, now);
					osc.frequency.exponentialRampToValueAtTime(isUp ? 420 : 95, now + 0.065);

					gain.gain.setValueAtTime(0.2, now);
					gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

					osc.connect(gain);
					gain.connect(this.ctx.destination);
					osc.start(now);
					osc.stop(now + 0.08);
				} catch (e) {}
			}

			playChime(type = 'change') {
				try {
					this.initContext();
					if (!this.ctx) return;
					const now = this.ctx.currentTime;
					const notes = type === 'match' ? [523.25, 659.25, 783.99, 1046.5] : [587.33, 880];
					notes.forEach((freq, idx) => {
						const osc = this.ctx.createOscillator();
						const gain = this.ctx.createGain();
						osc.type = 'sine';
						osc.frequency.setValueAtTime(freq, now + idx * 0.11);
						gain.gain.setValueAtTime(0.16, now + idx * 0.11);
						gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.28);
						osc.connect(gain);
						gain.connect(this.ctx.destination);
						osc.start(now + idx * 0.11);
						osc.stop(now + idx * 0.11 + 0.3);
					});
				} catch (e) {}
			}

			getAvailableVoices() {
				if (!this.voices || this.voices.length === 0) {
					if ('speechSynthesis' in window) {
						try {
							const list = window.speechSynthesis.getVoices();
							if (list && list.length > 0) this.voices = list;
						} catch (e) {}
					}
				}
				return this.voices || [];
			}

			cancelSpeech() {
				if ('speechSynthesis' in window) {
					try {
						window.speechSynthesis.cancel();
					} catch (e) {}
				}
				this.activeUtterances.clear();
			}

			speakEnglishCall(enText, onComplete = null) {
				if (!state.voiceEnabled || !('speechSynthesis' in window)) {
					if (onComplete) {
						autoSwapTimerId = setTimeout(onComplete, 650);
					}
					return;
				}

				let finished = false;
				const done = () => {
					if (finished) return;
					finished = true;
					if (autoSwapTimerId) {
						clearTimeout(autoSwapTimerId);
						autoSwapTimerId = null;
					}
					if (onComplete) onComplete();
				};

				try {
					// 連続タップ時に古い音声キューが溜まるのを防ぐため、保留中音声をすべて破棄
					window.speechSynthesis.cancel();
					this.activeUtterances.clear();

					const utter = new SpeechSynthesisUtterance(enText);
					const voices = this.getAvailableVoices();
					const enVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-us'))
						|| voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
					if (enVoice) {
						utter.voice = enVoice;
						utter.lang = enVoice.lang;
					} else {
						utter.lang = 'en-US';
					}
					utter.rate = 1.0;
					utter.pitch = 1.0;

					// ガベージコレクションによる発話中断を防止するため参照を保持
					this.activeUtterances.add(utter);

					utter.onend = () => {
						this.activeUtterances.delete(utter);
						if (onComplete) {
							autoSwapTimerId = setTimeout(done, 180);
						}
					};
					utter.onerror = () => {
						this.activeUtterances.delete(utter);
						if (onComplete) {
							autoSwapTimerId = setTimeout(done, 180);
						}
					};

					if (onComplete) {
						autoSwapTimerId = setTimeout(done, 2100);
					}

					// cancel() 直後の同期 speak() がブラウザ側で破棄されるのを防ぐため、わずかな非同期ディレイで発声
					setTimeout(() => {
						try {
							window.speechSynthesis.speak(utter);
						} catch (e) {}
					}, 10);
				} catch (e) {
					if (onComplete) {
						autoSwapTimerId = setTimeout(done, 650);
					}
				}
			}

			/**
			 * ゲーム終了・マッチ終了時コール:
			 * 英語フレーズとプレイヤー名を分割して連続キューイング。
			 * onend の非同期コールバックではなく同期的に speak() をキューへ積むことで
			 * iOS Safari の User Gesture 制限による2声目の無音化を防止。
			 */
			speakWinnerCall(prefixEnText, playerName) {
				if (!state.voiceEnabled || !('speechSynthesis' in window)) {
					return;
				}
				try {
					window.speechSynthesis.cancel();
					this.activeUtterances.clear();

					const voices = this.getAvailableVoices();
					const enVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-us'))
						|| voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));

					const prefixUtter = new SpeechSynthesisUtterance(prefixEnText);
					if (enVoice) {
						prefixUtter.voice = enVoice;
						prefixUtter.lang = enVoice.lang;
					} else {
						prefixUtter.lang = 'en-US';
					}
					prefixUtter.rate = 1.0;
					prefixUtter.pitch = 1.0;

					this.activeUtterances.add(prefixUtter);
					prefixUtter.onend = prefixUtter.onerror = () => {
						this.activeUtterances.delete(prefixUtter);
					};

					const cleanName = String(playerName || '').trim();
					let nameUtter = null;
					if (cleanName) {
						const hasNonAscii = /[^\x00-\x7F]/.test(cleanName);
						nameUtter = new SpeechSynthesisUtterance(cleanName);
						if (hasNonAscii) {
							const jaVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
							if (jaVoice) {
								nameUtter.voice = jaVoice;
								nameUtter.lang = jaVoice.lang;
							} else {
								nameUtter.lang = 'ja-JP';
							}
						} else if (enVoice) {
							nameUtter.voice = enVoice;
							nameUtter.lang = enVoice.lang;
						} else {
							nameUtter.lang = 'en-US';
						}
						nameUtter.rate = 1.0;
						nameUtter.pitch = 1.0;

						this.activeUtterances.add(nameUtter);
						nameUtter.onend = nameUtter.onerror = () => {
							this.activeUtterances.delete(nameUtter);
						};
					}

					// 同期的にキューに積むことでiOS Safariでも確実に順番再生される
					window.speechSynthesis.speak(prefixUtter);
					if (nameUtter) {
						window.speechSynthesis.speak(nameUtter);
					}
				} catch (e) {}
			}
		}

		const sound = new SoundSystem();

		function buildEnglishScoreCall(extraNotice = '') {
			const p0 = state.teams[0].points;
			const p1 = state.teams[1].points;

			if (p0 === 0 && p1 === 0 && !extraNotice) {
				return 'Love All';
			}

			const serverIdx = getCurrentServerTeamIdx();
			const receiverIdx = 1 - serverIdx;
			const sPts = state.teams[serverIdx].points;
			const rPts = state.teams[receiverIdx].points;

			let scorePhrase = '';
			if (sPts === rPts) {
				scorePhrase = `${numberToEnglishWord(sPts)} All`;
			} else {
				scorePhrase = `${numberToEnglishWord(sPts)}, ${numberToEnglishWord(rPts)}`;
			}

			return [scorePhrase, extraNotice].filter(Boolean).join('. ');
		}

		// ============================================================================
		// 4. 卓球ルール判定ヘルパー
		// ============================================================================
		function isDecidingGame() {
			if (state.bestOf === 1) return true;
			const needed = Math.ceil(state.bestOf / 2);
			return state.teams[0].games === needed - 1 && state.teams[1].games === needed - 1;
		}

		function getServerForScore(p0, p1, initialServer) {
			const total = p0 + p1;
			const switches = total < 20 ? Math.floor(total / 2) : 10 + (total - 20);
			return switches % 2 === 0 ? initialServer : 1 - initialServer;
		}

		function getCurrentServerTeamIdx() {
			return getServerForScore(state.teams[0].points, state.teams[1].points, state.initialServerTeamIdx);
		}

		function checkGameWinnerTeamIdx() {
			const p0 = state.teams[0].points;
			const p1 = state.teams[1].points;
			const maxP = Math.max(p0, p1);
			const minP = Math.min(p0, p1);
			const diff = maxP - minP;

			// 1. 通常勝利（11点以上かつ2点差）: 11-0〜11-9、またはデュース後の2点差勝ち(12-10, 13-11等)
			if (maxP >= 11 && diff >= 2) {
				return p0 > p1 ? 0 : 1;
			}
			// 2. デュース突入後（両者10点以上）のデュース上限到達判定（1点差勝ち可）
			// 例: 上限11本なら 10-10 の後 11点に達した側 (11-10) が即勝利（デュースなし）
			// 例: 上限12〜15本なら 10-10 の後その点数に達した側が即勝利
			if (state.deuceLimit && minP >= 10 && maxP >= state.deuceLimit) {
				return p0 > p1 ? 0 : 1;
			}
			return -1;
		}

		function checkMatchWinnerTeamIdx() {
			const needed = Math.ceil(state.bestOf / 2);
			if (state.teams[0].games >= needed) return 0;
			if (state.teams[1].games >= needed) return 1;
			return -1;
		}

		// ============================================================================
		// 5. 高速・高視認性 スコアカード・パネルクラス (シームレス一体型スライド)
		// ============================================================================
		class CSSSplitFlapCard {
			constructor(el) {
				this.el = el;
				this.role = el.dataset.role; // 'point' | 'game'
				this.side = el.dataset.side; // 'left' | 'right'
				this.digitEl = el.querySelector('.card-digit');
				this.currentVal = null;
				this.animTimer = null;
			}

			setPressedHighlight(isPressed) {
				this.el.classList.toggle('pressing', isPressed);
			}

			clearActiveFlaps() {
				if (this.animTimer) {
					clearTimeout(this.animTimer);
					this.animTimer = null;
				}
				this.el.classList.remove('anim-slide-down', 'anim-slide-up', 'pulse-anim');
				if (this.currentVal !== null && this.digitEl) {
					const isYellow = this.role === 'point' && this.currentVal >= 10;
					const isTwoDigits = String(this.currentVal).length >= 2;
					this.el.classList.toggle('yellow-digits', isYellow);
					this.el.classList.toggle('two-digits', isTwoDigits);
					this.digitEl.textContent = String(this.currentVal);
					this.digitEl.classList.toggle('two-digits-text', isTwoDigits);
				}
			}

			updateVisual(newVal, animateFlip = true, direction = 1) {
				const isFirstInit = this.currentVal === null;
				if (this.currentVal === newVal) return;

				this.currentVal = newVal;

				const isYellow = this.role === 'point' && newVal >= 10;
				const isTwoDigits = String(newVal).length >= 2;
				this.el.classList.toggle('yellow-digits', isYellow);
				this.el.classList.toggle('two-digits', isTwoDigits);

				if (this.digitEl) {
					this.digitEl.textContent = String(newVal);
					this.digitEl.classList.toggle('two-digits-text', isTwoDigits);
				}

				if (isFirstInit || !animateFlip) {
					this.el.classList.remove('anim-slide-down', 'anim-slide-up', 'pulse-anim');
					return;
				}

				// アニメーションの再トリガー（クラスの再適用で連続タップ時も確実に滑らかに追従）
				if (this.animTimer) {
					clearTimeout(this.animTimer);
					this.animTimer = null;
				}
				this.el.classList.remove('anim-slide-down', 'anim-slide-up', 'pulse-anim');
				void this.el.offsetWidth; // Reflow to restart CSS animation

				const animClass = direction >= 0 ? 'anim-slide-down' : 'anim-slide-up';
				this.el.classList.add(animClass, 'pulse-anim');

				this.animTimer = setTimeout(() => {
					this.el.classList.remove('anim-slide-down', 'anim-slide-up', 'pulse-anim');
					this.animTimer = null;
				}, 240);
			}
		}

		let textMeasureCtx = null;
		function measureTextWidthPx(text, fontWeight, fontSizePx, fontFamily) {
			if (!textMeasureCtx) {
				const canvas = document.createElement('canvas');
				textMeasureCtx = canvas.getContext('2d');
			}
			if (!textMeasureCtx) return text.length * fontSizePx;
			textMeasureCtx.font = `${fontWeight} ${fontSizePx}px ${fontFamily}`;
			return textMeasureCtx.measureText(text).width;
		}

		// スコアボード上部のプレイヤー名入力欄: 長い名前の場合は横幅に収まるようフォントサイズを自動縮小
		function fitScoreboardNameInput(inputEl) {
			if (!inputEl) return;
			inputEl.style.fontSize = '';
			const availW = inputEl.clientWidth - 12;
			if (availW <= 20) return;
			const computed = window.getComputedStyle(inputEl);
			const baseFontPx = parseFloat(computed.fontSize) || 24;
			const text = inputEl.value || 'Player1';
			const measuredW = measureTextWidthPx(
				text,
				computed.fontWeight || '900',
				baseFontPx,
				computed.fontFamily || 'sans-serif'
			);
			if (measuredW > availW) {
				const scaledPx = Math.max(7.5, Math.floor((baseFontPx * availW / measuredW) * 10) / 10);
				inputEl.style.fontSize = `${scaledPx}px`;
			}
		}

		// 試合結果画面のプレイヤー名欄・メモ欄(textarea): 文字数・折り返し行数に応じて高さを自動調整
		function autoResizeResultNameTextarea(el) {
			if (!el) return;
			el.style.height = 'auto';
			if (el.scrollHeight > 0) {
				el.style.height = `${el.scrollHeight}px`;
			}
		}

		function renderGameDots(containerEl, gamesWon, neededGames) {
			containerEl.dataset.count = String(neededGames);
			containerEl.innerHTML = '';
			for (let i = 0; i < neededGames; i++) {
				const dot = document.createElement('span');
				dot.className = 'game-dot' + (i < gamesWon ? ' won' : '');
				containerEl.appendChild(dot);
			}
		}

		function syncUIAndBoard({ animate = true, direction = 1 } = {}) {
			const leftTeam = state.teams[state.leftTeamIdx];
			const rightTeam = state.teams[state.rightTeamIdx];

			units.leftPoint.updateVisual(leftTeam.points, animate, direction);
			units.leftGame.updateVisual(leftTeam.games, animate, direction);
			units.rightGame.updateVisual(rightTeam.games, animate, direction);
			units.rightPoint.updateVisual(rightTeam.points, animate, direction);

			const serverTeamIdx = getCurrentServerTeamIdx();
			leftServeBarEl.classList.toggle('active', serverTeamIdx === state.leftTeamIdx);
			rightServeBarEl.classList.toggle('active', serverTeamIdx === state.rightTeamIdx);

			const neededGames = Math.ceil(state.bestOf / 2);
			renderGameDots(leftDotsBarEl, leftTeam.games, neededGames);
			renderGameDots(rightDotsBarEl, rightTeam.games, neededGames);

			if (document.activeElement !== leftNameInputEl) {
				leftNameInputEl.value = leftTeam.name;
			}
			if (document.activeElement !== rightNameInputEl) {
				rightNameInputEl.value = rightTeam.name;
			}
			fitScoreboardNameInput(leftNameInputEl);
			fitScoreboardNameInput(rightNameInputEl);

			formatMainLabelEl.textContent = `${state.bestOf}G`;
			const formatSubLabelEl = document.getElementById('format-sub-label');
			if (formatSubLabelEl) {
				formatSubLabelEl.textContent = state.deuceLimit ? `MAX ${state.deuceLimit}` : 'MATCH';
			}
			const btnMatchFormatEl = document.getElementById('btn-match-format');
			if (btnMatchFormatEl) {
				btnMatchFormatEl.title = state.deuceLimit
					? `マッチ形式: ${state.bestOf}ゲームズ (デュース上限: ${state.deuceLimit}本)`
					: `マッチ形式: ${state.bestOf}ゲームズ (上限なし)`;
			}
			updateMatchTimerUI();
			saveActiveMatchToStorage();
		}

		// 完了したマッチを履歴リスト＆localStorageに保存する
		function recordCompletedMatch() {
			const endTime = Date.now();
			const startTime = state.matchStartTime || endTime;
			state.matchEndTime = endTime;
			updateMatchTimerUI();

			const matchId = `match_${endTime}_${Math.random().toString(36).slice(2, 7)}`;
			const record = {
				id: matchId,
				bestOf: state.bestOf,
				deuceLimit: state.deuceLimit,
				startTime,
				endTime,
				durationMs: Math.max(0, endTime - startTime),
				player0Name: state.teams[0].name,
				player1Name: state.teams[1].name,
				games0: state.teams[0].games,
				games1: state.teams[1].games,
				gamesHistory: JSON.parse(JSON.stringify(state.completedGamesHistory)),
				memo: ''
			};

			// 最新の試合が先頭に来るように unshift で追加
			state.matchRecords.unshift(record);
			state.currentSavedMatchId = matchId;
			saveMatchRecordsToStorage();
			saveActiveMatchToStorage();
		}

		// 万一マッチ終了直後に「1つ戻す」が押された場合は、今保存したばかりのマッチ完了レコードを取り消す
		function removeJustSavedMatchRecord() {
			if (!state.currentSavedMatchId) return;
			const idx = state.matchRecords.findIndex(r => r.id === state.currentSavedMatchId);
			if (idx !== -1) {
				state.matchRecords.splice(idx, 1);
				saveMatchRecordsToStorage();
			}
			state.currentSavedMatchId = null;
			state.matchEndTime = null;
			updateMatchTimerUI();
			saveActiveMatchToStorage();
		}

		let inboardShowTime = 0;
		function showInboardBar(phase, winnerTeamIdx) {
			state.pendingPhase = phase;
			state.pendingWinnerIdx = winnerTeamIdx;
			inboardShowTime = Date.now();
			const winner = state.teams[winnerTeamIdx];
			inboardBtnRowEl.innerHTML = '';

			// タッチイベントのすり抜け・誤タップを完全防止する安全ガード（表示直後450ms以内のクリックを無効化）
			const safeClick = (callback) => {
				return (e) => {
					if (Date.now() - inboardShowTime < 450) {
						if (e) {
							e.preventDefault();
							e.stopPropagation();
						}
						return;
					}
					callback(e);
				};
			};

			if (phase === 'game_end') {
				inboardTitleEl.textContent = `${winner.name} がこのゲームを獲得！`;

				const nextBtn = document.createElement('button');
				nextBtn.className = 'inboard-btn primary';
				nextBtn.textContent = '次のゲームへ';
				nextBtn.addEventListener('click', safeClick(() => {
					hideInboardBar();
					proceedToNextGame();
				}));

				const undoBtn = document.createElement('button');
				undoBtn.className = 'inboard-btn secondary';
				undoBtn.textContent = '1つ戻す';
				undoBtn.addEventListener('click', safeClick(() => {
					undoCompletedGamePoint();
				}));

				inboardBtnRowEl.appendChild(nextBtn);
				inboardBtnRowEl.appendChild(undoBtn);
			} else if (phase === 'match_end') {
				inboardTitleEl.textContent = `試合終了！ 勝者: ${winner.name}`;

				const resultBtn = document.createElement('button');
				resultBtn.className = 'inboard-btn primary';
				resultBtn.textContent = '試合結果を見る';
				resultBtn.addEventListener('click', safeClick(() => {
					openResultView();
				}));

				const newMatchBtn = document.createElement('button');
				newMatchBtn.className = 'inboard-btn gold';
				newMatchBtn.textContent = '新しい試合を開始';
				newMatchBtn.addEventListener('click', safeClick(() => {
					hideInboardBar();
					resetEntireMatch();
				}));

				const undoBtn = document.createElement('button');
				undoBtn.className = 'inboard-btn secondary';
				undoBtn.textContent = '1つ戻す';
				undoBtn.addEventListener('click', safeClick(() => {
					undoCompletedGamePoint();
				}));

				inboardBtnRowEl.appendChild(resultBtn);
				inboardBtnRowEl.appendChild(newMatchBtn);
				inboardBtnRowEl.appendChild(undoBtn);
			}

			inboardOverlayEl.classList.add('active');
			saveActiveMatchToStorage();
		}

		function hideInboardBar() {
			state.pendingPhase = 'none';
			state.pendingWinnerIdx = -1;
			inboardOverlayEl.classList.remove('active');
			saveActiveMatchToStorage();
		}

		function proceedToNextGame() {
			state.teams[0].points = 0;
			state.teams[1].points = 0;
			state.currentGameRallyLog = [];
			state.actionUndoStack = [];
			state.decidingSwapped = false;
			state.initialServerTeamIdx = 1 - state.initialServerTeamIdx;
			swapCourts('Change Ends - Next Game');
			syncUIAndBoard({ animate: true, direction: -1 });
			sound.speakEnglishCall('Change Ends. Love All');
		}

		function undoCompletedGamePoint() {
			if (state.pendingPhase === 'match_end') {
				removeJustSavedMatchRecord();
			}
			const lastAction = state.actionUndoStack[state.actionUndoStack.length - 1];
			if (state.pendingWinnerIdx !== -1 && lastAction && lastAction.type === 'point') {
				const winner = state.teams[state.pendingWinnerIdx];
				winner.games = Math.max(0, winner.games - 1);
				state.completedGamesHistory.pop();
			}
			hideInboardBar();
			undoLastAction();
		}

		// ============================================================================
		// 7. スコア操作 & 最終ゲーム自動チェンジエンドの段階的シーケンス
		// ============================================================================
		function swapCourts(announceText = 'Change Ends') {
			const tmp = state.leftTeamIdx;
			state.leftTeamIdx = state.rightTeamIdx;
			state.rightTeamIdx = tmp;

			scoreboardStageEl.classList.add('swapping');
			setTimeout(() => {
				scoreboardStageEl.classList.remove('swapping');
			}, 260);

			sound.playChime('change');
			showToast(announceText);
		}

		function incrementPanelValue(unit) {
			if (isInteractionLocked()) return;

			// まだ「試合開始」ボタンを押さずにパネルをタップした場合、このタイミングで自動的に試合開始とする
			if (!state.matchStarted) {
				startMatchNow(false);
			}

			const teamIdx = unit.side === 'left' ? state.leftTeamIdx : state.rightTeamIdx;
			const team = state.teams[teamIdx];

			if (unit.role === 'point') {
				sound.cancelSpeech();
				const nextPoints = team.points + 1;
				if (nextPoints > 99) return;

				const serverBeforePoint = getCurrentServerTeamIdx();
				team.points = nextPoints;

				state.currentGameRallyLog.push({
					scorer: teamIdx,
					p0: state.teams[0].points,
					p1: state.teams[1].points,
					server: serverBeforePoint
				});
				state.actionUndoStack.push({ type: 'point', teamIdx });

				sound.playFlipSound(true);
				syncUIAndBoard({ animate: true, direction: 1 });

				const gameWinnerIdx = checkGameWinnerTeamIdx();
				if (gameWinnerIdx !== -1) {
					handleGameFinished(gameWinnerIdx);
					return;
				}

				// 最終ゲーム（セットオール）の5点自動チェンジエンド判定
				const shouldAutoSwapAtFive = (
					isDecidingGame() &&
					!state.decidingSwapped &&
					(state.teams[0].points === 5 || state.teams[1].points === 5) &&
					state.teams[0].points + state.teams[1].points < 10
				);

				const scoreCallText = buildEnglishScoreCall();

				if (shouldAutoSwapAtFive) {
					state.decidingSwapped = true;
					state.autoSwapPending = true;
					saveActiveMatchToStorage();

					sound.speakEnglishCall(scoreCallText, () => {
						if (!state.autoSwapPending) return;
						state.autoSwapPending = false;

						swapCourts('Change Ends (5 Points)');
						syncUIAndBoard({ animate: true, direction: 1 });
						sound.speakEnglishCall('Change Ends');
					});
				} else {
					sound.speakEnglishCall(scoreCallText);
				}
			} else if (unit.role === 'game') {
				const maxWins = Math.ceil(state.bestOf / 2);
				const nextGames = team.games + 1;
				if (nextGames > maxWins) return;

				team.games = nextGames;
				state.actionUndoStack.push({ type: 'game', teamIdx });

				sound.playFlipSound(true);
				syncUIAndBoard({ animate: true, direction: 1 });

				const matchWinnerIdx = checkMatchWinnerTeamIdx();
				if (matchWinnerIdx !== -1) {
					recordCompletedMatch();
					showInboardBar('match_end', matchWinnerIdx);
				}
			}
		}

		function undoLastAction() {
			if (state.modalOpen || state.pendingPhase !== 'none') return;

			const wasAutoSwapPending = state.autoSwapPending;
			cancelPendingAutoSwap();

			if (state.actionUndoStack.length === 0) {
				showToast('戻せる操作がありません');
				return;
			}

			const lastAction = state.actionUndoStack.pop();
			if (lastAction.type === 'point') {
				state.currentGameRallyLog.pop();
				const scorerTeam = state.teams[lastAction.teamIdx];
				scorerTeam.points = Math.max(0, scorerTeam.points - 1);

				if (state.decidingSwapped && state.teams[0].points < 5 && state.teams[1].points < 5) {
					state.decidingSwapped = false;
					if (!wasAutoSwapPending) {
						swapCourts('Undo 5-Point Change Ends');
					}
				}
			} else if (lastAction.type === 'game') {
				const team = state.teams[lastAction.teamIdx];
				team.games = Math.max(0, team.games - 1);
			}

			sound.playFlipSound(false);
			syncUIAndBoard({ animate: true, direction: -1 });
		}

		function handleGameFinished(winnerTeamIdx) {
			const winner = state.teams[winnerTeamIdx];
			winner.games += 1;

			const gameNum = state.completedGamesHistory.length + 1;
			state.completedGamesHistory.push({
				gameNumber: gameNum,
				winner: winnerTeamIdx,
				p0: state.teams[0].points,
				p1: state.teams[1].points,
				log: [...state.currentGameRallyLog]
			});

			syncUIAndBoard({ animate: true, direction: 1 });

			const matchWinnerIdx = checkMatchWinnerTeamIdx();
			// タップ連打による次ポイント混入を即時防止するため、400msディレイを待たずに即時ロック
			state.pendingPhase = (matchWinnerIdx !== -1) ? 'match_end' : 'game_end';
			state.pendingWinnerIdx = (matchWinnerIdx !== -1) ? matchWinnerIdx : winnerTeamIdx;

			if (matchWinnerIdx !== -1) {
				sound.playChime('match');
				sound.speakWinnerCall('Game and Match', winner.name);
				recordCompletedMatch();
				// アニメーション完了を待ち、タップの誤爆を防ぐため 400ms のディレイを設ける
				setTimeout(() => {
					showInboardBar('match_end', matchWinnerIdx);
				}, 400);
			} else {
				sound.playChime('change');
				sound.speakWinnerCall('Game', winner.name);
				// アニメーション完了を待ち、タップの誤爆を防ぐため 400ms のディレイを設ける
				setTimeout(() => {
					showInboardBar('game_end', winnerTeamIdx);
				}, 400);
			}
		}

		function renderResultView() {
			resultsListContainerEl.innerHTML = '';
			const hasRecords = state.matchRecords.length > 0;
			btnClearResultsEl.disabled = !hasRecords;

			if (!hasRecords) {
				const emptyDiv = document.createElement('div');
				emptyDiv.className = 'empty-state-box';
				emptyDiv.textContent = 'まだ完了した試合結果がありません。試合が終了するとここに履歴が保存されます。';
				resultsListContainerEl.appendChild(emptyDiv);
				return;
			}

			// 開始日付（YYYY/MM/DD）ごとにグループ化（日付降順・試合開始時刻降順）
			const todayDateKey = formatDateOnlyJP(Date.now());
			const sortedRecords = [...state.matchRecords].sort(
				(a, b) => (b.startTime || b.endTime || 0) - (a.startTime || a.endTime || 0)
			);

			const dateGroupsMap = new Map();
			sortedRecords.forEach(rec => {
				const dateKey = formatDateOnlyJP(rec.startTime || rec.endTime);
				if (!dateGroupsMap.has(dateKey)) {
					dateGroupsMap.set(dateKey, []);
				}
				dateGroupsMap.get(dateKey).push(rec);
			});

			dateGroupsMap.forEach((groupRecords, dateKey) => {
				const isToday = (dateKey === todayDateKey);
				// デフォルトで当日の結果は開いた状態、過去日の履歴は閉じた状態にする
				const isOpen = (dateKey in state.resultDateOpenMap)
					? state.resultDateOpenMap[dateKey]
					: isToday;
				state.resultDateOpenMap[dateKey] = isOpen;

				const groupEl = document.createElement('div');
				groupEl.className = 'result-date-group' + (isOpen ? '' : ' collapsed');

				const headerBtn = document.createElement('button');
				headerBtn.type = 'button';
				headerBtn.className = 'result-date-header';
				headerBtn.setAttribute('aria-expanded', String(isOpen));

				const headerLeft = document.createElement('div');
				headerLeft.className = 'result-date-header-left';

				const chevron = document.createElement('span');
				chevron.className = 'result-date-chevron';
				chevron.textContent = '▼';
				headerLeft.appendChild(chevron);

				const dateLabel = document.createElement('span');
				dateLabel.textContent = dateKey;
				headerLeft.appendChild(dateLabel);

				if (isToday) {
					const todayBadge = document.createElement('span');
					todayBadge.className = 'date-today-badge';

		// 全試合結果（推移データ・メモ含む）をJSON形式でエクスポート（ダウンロード）
		function exportMatchRecordsToJson() {
			if (state.matchRecords.length === 0) {
				showToast('エクスポートする試合結果がありません');
				return;
			}
			try {
				const jsonText = JSON.stringify(state.matchRecords, null, 2);
				const blob = new Blob([jsonText], { type: 'application/json;charset=utf-8' });
				const url = URL.createObjectURL(blob);
				const d = new Date();
				const yyyy = d.getFullYear();
				const mo = String(d.getMonth() + 1).padStart(2, '0');
				const da = String(d.getDate()).padStart(2, '0');
				const hh = String(d.getHours()).padStart(2, '0');
				const mi = String(d.getMinutes()).padStart(2, '0');
				const ss = String(d.getSeconds()).padStart(2, '0');
				const fileName = `tt_match_results_${yyyy}${mo}${da}_${hh}${mi}${ss}.json`;

				const a = document.createElement('a');
				a.href = url;
				a.download = fileName;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				setTimeout(() => URL.revokeObjectURL(url), 1000);
				showToast(`${state.matchRecords.length}件の試合結果をエクスポートしました`);
			} catch (e) {
				showToast('エクスポートに失敗しました');
			}
		}

		// インポートされた各試合レコードの検証＆正規化
		function normalizeImportedMatchRecord(item) {
			if (!item || typeof item !== 'object') return null;
			const hasCore = (
				typeof item.player0Name === 'string' ||
				typeof item.player1Name === 'string' ||
				typeof item.games0 === 'number' ||
				typeof item.games1 === 'number' ||
				Array.isArray(item.gamesHistory)
			);
			if (!hasCore) return null;

			const now = Date.now();
			const startTime = (typeof item.startTime === 'number' && Number.isFinite(item.startTime))
				? item.startTime
				: ((typeof item.endTime === 'number' && Number.isFinite(item.endTime)) ? item.endTime : now);
			const endTime = (typeof item.endTime === 'number' && Number.isFinite(item.endTime))
				? item.endTime
				: startTime;
			const durationMs = (typeof item.durationMs === 'number' && Number.isFinite(item.durationMs) && item.durationMs >= 0)
				? item.durationMs
				: Math.max(0, endTime - startTime);
			const id = (typeof item.id === 'string' && item.id.trim())
				? item.id.trim()
				: `match_${endTime}_${Math.random().toString(36).slice(2, 7)}`;
			const bestOf = [1, 3, 5, 7].includes(Number(item.bestOf)) ? Number(item.bestOf) : 5;
			const deuceLimit = [11, 12, 13, 14, 15].includes(Number(item.deuceLimit)) ? Number(item.deuceLimit) : null;
			const player0Name = (typeof item.player0Name === 'string' && item.player0Name.trim()) ? item.player0Name.trim() : 'Player1';
			const player1Name = (typeof item.player1Name === 'string' && item.player1Name.trim()) ? item.player1Name.trim() : 'Player2';
			const games0 = Math.max(0, Number(item.games0) || 0);
			const games1 = Math.max(0, Number(item.games1) || 0);

			const gamesHistory = Array.isArray(item.gamesHistory)
				? item.gamesHistory.map((g, idx) => {
					const p0 = Math.max(0, Number(g && g.p0) || 0);
					const p1 = Math.max(0, Number(g && g.p1) || 0);
					const winner = (g && (g.winner === 0 || g.winner === 1))
						? g.winner
						: (p0 >= p1 ? 0 : 1);
					const log = Array.isArray(g && g.log)
						? g.log
							.filter(entry => entry && typeof entry === 'object')
							.map(entry => ({
								scorer: entry.scorer === 1 ? 1 : 0,
								p0: Math.max(0, Number(entry.p0) || 0),
								p1: Math.max(0, Number(entry.p1) || 0),
								server: entry.server === 1 ? 1 : 0
							}))
						: [];
					return {
						gameNumber: Number(g && g.gameNumber) || (idx + 1),
						winner,
						p0,
						p1,
						log
					};
				})
				: [];

			const memo = typeof item.memo === 'string' ? item.memo : '';

			return {
				id,
				bestOf,
				deuceLimit,
				startTime,
				endTime,
				durationMs,
				player0Name,
				player1Name,
				games0,
				games1,
				gamesHistory,
				memo
			};
		}

		// JSONファイルから試合結果を読み込み、localStorageに追加登録
		function importMatchRecordsFromJsonFile(file) {
			if (!file) return;
			const reader = new FileReader();
			reader.onload = () => {
				try {
					const text = String(reader.result || '').trim();
					if (!text) {
						showToast('ファイルが空です');
						return;
					}
					const parsed = JSON.parse(text);
					let rawList = null;
					if (Array.isArray(parsed)) {
						rawList = parsed;
					} else if (parsed && typeof parsed === 'object') {
						if (Array.isArray(parsed.matchRecords)) {
							rawList = parsed.matchRecords;
						} else {
							rawList = [parsed];
						}
					}
					if (!rawList || rawList.length === 0) {
						showToast('インポートできる試合結果が見つかりません');
						return;
					}

					const validRecords = rawList.map(normalizeImportedMatchRecord).filter(Boolean);
					if (validRecords.length === 0) {
						showToast('有効な試合結果データが含まれていません');
						return;
					}

					const existingIds = new Set(state.matchRecords.map(r => r && r.id).filter(Boolean));
					let addedCount = 0;
					let updatedCount = 0;

					validRecords.forEach(rec => {
						if (existingIds.has(rec.id)) {
							const idx = state.matchRecords.findIndex(r => r && r.id === rec.id);
							if (idx !== -1) {
								state.matchRecords[idx] = rec;
								updatedCount++;
							}
						} else {
							state.matchRecords.push(rec);
							existingIds.add(rec.id);
							addedCount++;
						}
					});

					// 開始日時の新しい順に整列して保存
					state.matchRecords.sort((a, b) => (b.startTime || b.endTime || 0) - (a.startTime || a.endTime || 0));
					saveMatchRecordsToStorage();
					renderResultView();

					if (addedCount > 0 && updatedCount > 0) {
						showToast(`${addedCount}件を追加、${updatedCount}件を更新しました`);
					} else if (addedCount > 0) {
						showToast(`${addedCount}件の試合結果を追加登録しました`);
					} else {
						showToast(`${updatedCount}件の試合結果を更新しました`);
					}
				} catch (e) {
					showToast('JSONファイルの解析に失敗しました');
				}
			};
			reader.onerror = () => {
				showToast('ファイルの読み込みに失敗しました');
			};
			reader.readAsText(file, 'utf-8');
		}
