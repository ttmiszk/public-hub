		function renderResultView() {
			resultsListContainerEl.innerHTML = '';
			const hasRecords = state.matchRecords.length > 0;
			btnClearResultsEl.disabled = !hasRecords;
			btnExportResultsEl.disabled = !hasRecords;

			if (!hasRecords) {
				const emptyDiv = document.createElement('div');
				emptyDiv.className = 'empty-state-box';
				emptyDiv.textContent = 'まだ完了した試合結果がありません。試合が終了するとここに履歴が保存されます。';
				resultsListContainerEl.appendChild(emptyDiv);
				return;
			}

			// 開始日付（YYYY/MM/DD）ごとにグループ化（日付降順・試合開始時刻降順）
			const todayDateKey = formatDateOnlyJP(Date.now());
			const sortedRecords = [...state.matchRecords].sort(
				(a, b) => (b.startTime || b.endTime || 0) - (a.startTime || a.endTime || 0)
			);

			const dateGroupsMap = new Map();
			sortedRecords.forEach(rec => {
				const dateKey = formatDateOnlyJP(rec.startTime || rec.endTime);
				if (!dateGroupsMap.has(dateKey)) {
					dateGroupsMap.set(dateKey, []);
				}
				dateGroupsMap.get(dateKey).push(rec);
			});

			dateGroupsMap.forEach((groupRecords, dateKey) => {
				const isToday = (dateKey === todayDateKey);
				// デフォルトで当日の結果は開いた状態、過去日の履歴は閉じた状態にする
				const isOpen = (dateKey in state.resultDateOpenMap)
					? state.resultDateOpenMap[dateKey]
					: isToday;
				state.resultDateOpenMap[dateKey] = isOpen;

				const groupEl = document.createElement('div');
				groupEl.className = 'result-date-group' + (isOpen ? '' : ' collapsed');

				const headerBtn = document.createElement('button');
				headerBtn.type = 'button';
				headerBtn.className = 'result-date-header';
				headerBtn.setAttribute('aria-expanded', String(isOpen));

				const headerLeft = document.createElement('div');
				headerLeft.className = 'result-date-header-left';

				const chevron = document.createElement('span');
				chevron.className = 'result-date-chevron';
				chevron.textContent = '▼';
				headerLeft.appendChild(chevron);

				const dateLabel = document.createElement('span');
				dateLabel.textContent = dateKey;
				headerLeft.appendChild(dateLabel);

				if (isToday) {
					const todayBadge = document.createElement('span');
					todayBadge.className = 'date-today-badge';
					todayBadge.textContent = '本日';
					headerLeft.appendChild(todayBadge);
				}

				const countBadge = document.createElement('span');
				countBadge.className = 'date-count-badge';
				countBadge.textContent = `${groupRecords.length}試合`;

				headerBtn.appendChild(headerLeft);
				headerBtn.appendChild(countBadge);

				const groupBody = document.createElement('div');
				groupBody.className = 'result-date-body';

				const textareasToResize = [];
				groupRecords.forEach(rec => {
					const { card, name0Input, name1Input, memoInput } = buildResultMatchCard(rec);
					groupBody.appendChild(card);
					textareasToResize.push(name0Input, name1Input, memoInput);
				});

				headerBtn.addEventListener('click', () => {
					const nextOpen = groupEl.classList.contains('collapsed');
					state.resultDateOpenMap[dateKey] = nextOpen;
					groupEl.classList.toggle('collapsed', !nextOpen);
					headerBtn.setAttribute('aria-expanded', String(nextOpen));
					if (nextOpen) {
						textareasToResize.forEach(el => autoResizeResultNameTextarea(el));
					}
				});

				groupEl.appendChild(headerBtn);
				groupEl.appendChild(groupBody);
				resultsListContainerEl.appendChild(groupEl);

				if (isOpen) {
					textareasToResize.forEach(el => autoResizeResultNameTextarea(el));
				}
			});
		}

		// 全試合結果（推移データ・メモ含む）をJSON形式でエクスポート（ダウンロード）
		function exportMatchRecordsToJson() {
			if (state.matchRecords.length === 0) {
				showToast('エクスポートする試合結果がありません');
				return;
			}
			try {
				const jsonText = JSON.stringify(state.matchRecords, null, 2);
				const blob = new Blob([jsonText], { type: 'application/json;charset=utf-8' });
				const url = URL.createObjectURL(blob);
				const d = new Date();
				const yyyy = d.getFullYear();
				const mo = String(d.getMonth() + 1).padStart(2, '0');
				const da = String(d.getDate()).padStart(2, '0');
				const hh = String(d.getHours()).padStart(2, '0');
				const mi = String(d.getMinutes()).padStart(2, '0');
				const ss = String(d.getSeconds()).padStart(2, '0');
				const fileName = `tt_match_results_${yyyy}${mo}${da}_${hh}${mi}${ss}.json`;

				const a = document.createElement('a');
				a.href = url;
				a.download = fileName;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				setTimeout(() => URL.revokeObjectURL(url), 1000);
				showToast(`${state.matchRecords.length}件の試合結果をエクスポートしました`);
			} catch (e) {
				showToast('エクスポートに失敗しました');
			}
		}

		// インポートされた各試合レコードの検証＆正規化
		function normalizeImportedMatchRecord(item) {
			if (!item || typeof item !== 'object') return null;
			const hasCore = (
				typeof item.player0Name === 'string' ||
				typeof item.player1Name === 'string' ||
				typeof item.games0 === 'number' ||
				typeof item.games1 === 'number' ||
				Array.isArray(item.gamesHistory)
			);
			if (!hasCore) return null;

			const now = Date.now();
			const startTime = (typeof item.startTime === 'number' && Number.isFinite(item.startTime))
				? item.startTime
				: ((typeof item.endTime === 'number' && Number.isFinite(item.endTime)) ? item.endTime : now);
			const endTime = (typeof item.endTime === 'number' && Number.isFinite(item.endTime))
				? item.endTime
				: startTime;
			const durationMs = (typeof item.durationMs === 'number' && Number.isFinite(item.durationMs) && item.durationMs >= 0)
				? item.durationMs
				: Math.max(0, endTime - startTime);
			const id = (typeof item.id === 'string' && item.id.trim())
				? item.id.trim()
				: `match_${endTime}_${Math.random().toString(36).slice(2, 7)}`;
			const bestOf = [1, 3, 5, 7].includes(Number(item.bestOf)) ? Number(item.bestOf) : 5;
			const player0Name = (typeof item.player0Name === 'string' && item.player0Name.trim()) ? item.player0Name.trim() : 'Player1';
			const player1Name = (typeof item.player1Name === 'string' && item.player1Name.trim()) ? item.player1Name.trim() : 'Player2';
			const games0 = Math.max(0, Number(item.games0) || 0);
			const games1 = Math.max(0, Number(item.games1) || 0);

			const gamesHistory = Array.isArray(item.gamesHistory)
				? item.gamesHistory.map((g, idx) => {
					const p0 = Math.max(0, Number(g && g.p0) || 0);
					const p1 = Math.max(0, Number(g && g.p1) || 0);
					const winner = (g && (g.winner === 0 || g.winner === 1))
						? g.winner
						: (p0 >= p1 ? 0 : 1);
					const log = Array.isArray(g && g.log)
						? g.log
							.filter(entry => entry && typeof entry === 'object')
							.map(entry => ({
								scorer: entry.scorer === 1 ? 1 : 0,
								p0: Math.max(0, Number(entry.p0) || 0),
								p1: Math.max(0, Number(entry.p1) || 0),
								server: entry.server === 1 ? 1 : 0
							}))
						: [];
					return {
						gameNumber: Number(g && g.gameNumber) || (idx + 1),
						winner,
						p0,
						p1,
						log
					};
				})
				: [];

			const memo = typeof item.memo === 'string' ? item.memo : '';

			return {
				id,
				bestOf,
				startTime,
				endTime,
				durationMs,
				player0Name,
				player1Name,
				games0,
				games1,
				gamesHistory,
				memo
			};
		}

		// JSONファイルから試合結果を読み込み、localStorageに追加登録
		function importMatchRecordsFromJsonFile(file) {
			if (!file) return;
			const reader = new FileReader();
			reader.onload = () => {
				try {
					const text = String(reader.result || '').trim();
					if (!text) {
						showToast('ファイルが空です');
						return;
					}
					const parsed = JSON.parse(text);
					let rawList = null;
					if (Array.isArray(parsed)) {
						rawList = parsed;
					} else if (parsed && typeof parsed === 'object') {
						if (Array.isArray(parsed.matchRecords)) {
							rawList = parsed.matchRecords;
						} else {
							rawList = [parsed];
						}
					}
					if (!rawList || rawList.length === 0) {
						showToast('インポートできる試合結果が見つかりません');
						return;
					}

					const validRecords = rawList.map(normalizeImportedMatchRecord).filter(Boolean);
					if (validRecords.length === 0) {
						showToast('有効な試合結果データが含まれていません');
						return;
					}

					const existingIds = new Set(state.matchRecords.map(r => r && r.id).filter(Boolean));
					let addedCount = 0;
					let updatedCount = 0;

					validRecords.forEach(rec => {
						if (existingIds.has(rec.id)) {
							const idx = state.matchRecords.findIndex(r => r && r.id === rec.id);
							if (idx !== -1) {
								state.matchRecords[idx] = rec;
								updatedCount++;
							}
						} else {
							state.matchRecords.push(rec);
							existingIds.add(rec.id);
							addedCount++;
						}
					});

					// 開始日時の新しい順に整列して保存
					state.matchRecords.sort((a, b) => (b.startTime || b.endTime || 0) - (a.startTime || a.endTime || 0));
					saveMatchRecordsToStorage();
					renderResultView();

					if (addedCount > 0 && updatedCount > 0) {
						showToast(`${addedCount}件を追加、${updatedCount}件を更新しました`);
					} else if (addedCount > 0) {
						showToast(`${addedCount}件の試合結果を追加登録しました`);
					} else {
						showToast(`${updatedCount}件の試合結果を更新しました`);
					}
				} catch (e) {
					showToast('JSONファイルの解析に失敗しました');
				}
			};
			reader.onerror = () => {
				showToast('ファイルの読み込みに失敗しました');
			};
			reader.readAsText(file, 'utf-8');
		}

		// ============================================================================
		// 9. スコア推移グラフ画面 (現在のマッチ または 選択した過去マッチの推移を表示)
		// ============================================================================
		const historyViewEl = document.getElementById('history-view');

		// スコアボード右下の「推移」ボタンから現在のマッチのスコア推移を開く

		function openHistoryViewForRecord(rec) {

		function renderHistoryTarget({ player0Name, player1Name, games0, games1, gamesList }) {
			histName0El.textContent = player0Name;
			histName1El.textContent = player1Name;

			const g0Class = games0 > games1 ? 'lead' : '';
			const g1Class = games1 > games0 ? 'lead' : '';

			historyContentEl.innerHTML = '';

			if (!gamesList || gamesList.length === 0) {

				card.appendChild(swipeArea);

				historyContentEl.appendChild(card);
			});
		}

		function buildLargeGameTimelineSVG(gameData, name0, name1) {
			const log = gameData.log || [];
			const nameColWidth = 150;
			const colStep = 62;
			const finalColWidth = 78;
			const rowHeight = 74;
			const totalHeight = rowHeight * 2;
			const totalWidth = nameColWidth + Math.max(log.length, 1) * colStep + finalColWidth;

			const svgNS = 'http://www.w3.org/2000/svg';
			const svg = document.createElementNS(svgNS, 'svg');
			svg.setAttribute('width', String(totalWidth));
			svg.setAttribute('height', String(totalHeight));
			svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
			svg.style.display = 'block';
			svg.style.minWidth = `${totalWidth}px`;

			const yRow0 = rowHeight * 0.5;
			const yRow1 = rowHeight * 1.5;

			const addLine = (x1, y1, x2, y2, stroke, width = 1.5) => {
				const line = document.createElementNS(svgNS, 'line');
				line.setAttribute('x1', x1);
				line.setAttribute('y1', y1);
				line.setAttribute('x2', x2);
				line.setAttribute('y2', y2);
				line.setAttribute('stroke', stroke);
				line.setAttribute('stroke-width', width);
				svg.appendChild(line);
			};

			addLine(0, 1, totalWidth, 1, 'rgba(255, 255, 255, 0.16)', 2);
			addLine(0, rowHeight, totalWidth - finalColWidth, rowHeight, 'rgba(255, 255, 255, 0.08)', 1.5);
			addLine(0, totalHeight - 1, totalWidth, totalHeight - 1, 'rgba(255, 255, 255, 0.16)', 2);

			const finalX = totalWidth - finalColWidth;
			const rect = document.createElementNS(svgNS, 'rect');
			rect.setAttribute('x', finalX);
			rect.setAttribute('y', 2);
			rect.setAttribute('width', finalColWidth);
			rect.setAttribute('height', totalHeight - 4);
			rect.setAttribute('fill', '#d97706');
			rect.setAttribute('rx', '8');
			svg.appendChild(rect);

			const addText = (txt, x, y, color, size, weight = '800', anchor = 'start') => {
				const t = document.createElementNS(svgNS, 'text');
				t.setAttribute('x', x);
				t.setAttribute('y', y);
				t.setAttribute('fill', color);
				t.setAttribute('font-size', size);
				t.setAttribute('font-weight', weight);
				t.setAttribute('text-anchor', anchor);
				t.setAttribute('dominant-baseline', 'central');
				t.textContent = txt;
				svg.appendChild(t);
				return t;
			};

			// SVG内のプレイヤー名表示: 長い名前の場合は2行に折り返し、さらに列幅を超える場合は横幅に合わせて縮小
			const addPlayerNameSVG = (rawName, x, centerY) => {
				const str = String(rawName || '');
				const maxColW = nameColWidth - x - 10; // 約128px
				const lines = str.length > 8
					? [str.slice(0, Math.ceil(str.length / 2)), str.slice(Math.ceil(str.length / 2))]
					: [str];
				const fontSizePx = lines.length > 1 ? 15 : 18;
				const lineOffsets = lines.length > 1 ? [-10, 10] : [0];

				lines.forEach((lineStr, idx) => {
					const tEl = addText(lineStr, x, centerY + lineOffsets[idx], '#ffffff', `${fontSizePx}px`, '900', 'start');
					const measuredW = measureTextWidthPx(lineStr, '900', fontSizePx, 'sans-serif');
					if (measuredW > maxColW) {
						tEl.setAttribute('textLength', String(maxColW));
						tEl.setAttribute('lengthAdjust', 'spacingAndGlyphs');
					}
				});
			};

			addPlayerNameSVG(name0, 12, yRow0);
			addPlayerNameSVG(name1, 12, yRow1);

			addText(String(gameData.p0), finalX + finalColWidth / 2, yRow0, '#ffffff', '22px', '900', 'middle');
			addText(String(gameData.p1), finalX + finalColWidth / 2, yRow1, '#ffffff', '22px', '900', 'middle');

			if (log.length > 1) {
				const polyPoints = log.map((entry, idx) => {
					const cx = nameColWidth + idx * colStep + colStep / 2;
					const cy = entry.scorer === 0 ? yRow0 : yRow1;
					return `${cx},${cy}`;
				}).join(' ');

				const polyline = document.createElementNS(svgNS, 'polyline');
				polyline.setAttribute('points', polyPoints);
				polyline.setAttribute('fill', 'none');
				polyline.setAttribute('stroke', '#38bdf8');
				polyline.setAttribute('stroke-width', '3.5');
				svg.appendChild(polyline);
			}

			log.forEach((entry, idx) => {
				const cx = nameColWidth + idx * colStep + colStep / 2;

				[0, 1].forEach(teamId => {
					const cy = teamId === 0 ? yRow0 : yRow1;
					const isScorer = entry.scorer === teamId;
					const ptsVal = teamId === 0 ? entry.p0 : entry.p1;

					const circle = document.createElementNS(svgNS, 'circle');
					circle.setAttribute('cx', cx);
					circle.setAttribute('cy', cy);
					circle.setAttribute('r', isScorer ? '18' : '15.5');
					circle.setAttribute('fill', isScorer ? '#0ea5e9' : 'rgba(255, 255, 255, 0.08)');
					svg.appendChild(circle);

					addText(
						String(ptsVal),
						cx,
						cy,
						isScorer ? '#ffffff' : '#94a3b8',
						isScorer ? '16px' : '14.5px',
						'900',
						'middle'
					);

					if (entry.server === teamId) {
						addLine(cx - 17, cy + 25, cx + 17, cy + 25, '#ef4444', 4);
					}
				});
			});

			return svg;
		}

		// ============================================================================
		// 10. モーダルダイアログ (ゲーム数選択・リセット確認・結果クリア確認)
		// ============================================================================
		const modalBackdropEl = document.getElementById('modal-backdrop');

		const modalDescEl = document.getElementById('modal-desc');
		const modalActionsEl = document.getElementById('modal-actions');

		function openModal({ title, desc, buttons, twoCols = false, gridMode = 'default' }) {
			state.modalOpen = true;
			modalTitleEl.textContent = title;
			modalDescEl.textContent = desc;
			modalActionsEl.innerHTML = '';
			modalActionsEl.className = 'modal-actions';
			if (twoCols) modalActionsEl.classList.add('two-cols-row');
			if (gridMode === 'format') modalActionsEl.classList.add('format-grid');

			buttons.forEach(btnDef => {
				const btn = document.createElement('button');
				btn.className = `modal-btn ${btnDef.variant || 'secondary'}`;
				if (btnDef.variant === 'cancel-full') {
					btn.style.gridColumn = '1 / -1';
				}
				btn.textContent = btnDef.label;
				if (btnDef.disabled) {
					btn.disabled = true;
				}
				btn.addEventListener('click', () => {
					if (btn.disabled) return;
					closeModal();
					if (btnDef.onClick) btnDef.onClick();
				});
				modalActionsEl.appendChild(btn);
			});

			modalBackdropEl.classList.add('active');
			requestAnimationFrame(() => {
				fitModalScale();
			});
		}

		function fitModalScale() {
			const modalCard = document.querySelector('.modal-card');
			if (!modalCard) return;
			modalCard.style.setProperty('--modal-scale', '1');
			const availH = window.innerHeight - 18;
			const cardH = modalCard.offsetHeight;
			if (cardH > availH && availH > 100) {
				const scaleFactor = Math.min(1, Math.floor((availH / cardH) * 98) / 100);
				modalCard.style.setProperty('--modal-scale', String(scaleFactor));
			}
		}

		function closeModal() {
			state.modalOpen = false;
			modalBackdropEl.classList.remove('active');
			const modalCard = document.querySelector('.modal-card');
			if (modalCard) modalCard.style.removeProperty('--modal-scale');
		}

		modalBackdropEl.addEventListener('click', (e) => {
			if (e.target === modalBackdropEl) {
				closeModal();
			}
		});

		function showResetConfirmModal() {
			openModal({
				title: 'リセットの確認',
				desc: 'リセットする範囲を選択してください。',
				twoCols: true,
				buttons: [
					{
						label: '現在のゲームをリセット',
						variant: 'primary',
						onClick: () => {
							const isFirstGame = state.completedGamesHistory.length === 0
								&& state.teams[0].games === 0
								&& state.teams[1].games === 0;
							if (isFirstGame) {
								resetEntireMatch();
								return;
							}
							const wasAutoSwapPending = state.autoSwapPending;
							cancelPendingAutoSwap();
							hideInboardBar();
							if (state.decidingSwapped && !wasAutoSwapPending) {
								[state.leftTeamIdx, state.rightTeamIdx] = [state.rightTeamIdx, state.leftTeamIdx];
							}
							state.teams[0].points = 0;
							state.teams[1].points = 0;
							state.currentGameRallyLog = [];
							state.actionUndoStack = [];
							state.decidingSwapped = false;
							syncUIAndBoard({ animate: true, direction: -1 });
							showToast('現在のゲームをリセットしました');
						}
					},
					{
						label: 'マッチ全体をリセット',
						variant: 'danger',
						onClick: () => {
							cancelPendingAutoSwap();
							hideInboardBar();
							resetEntireMatch();
						}
					},
					{
						label: 'キャンセル',
						variant: 'cancel-full'
					}
				]
			});
		}

		function showDeleteResultConfirmModal(targetMatchId = null) {
			if (state.matchRecords.length === 0) return;
			const isDeleteAll = targetMatchId === null;
			openModal({
				title: isDeleteAll ? '全ての試合結果を削除' : '試合結果の削除',
				desc: isDeleteAll
					? '保存されている全ての試合結果とスコア推移を削除しますか？\n（現在進行中のマッチは削除されません）'
					: '選択した試合結果とスコア推移を削除しますか？',
				twoCols: true,
				buttons: [
					{
						label: '削除する',
						variant: 'danger',
						onClick: () => {
							if (isDeleteAll) {
								state.matchRecords = [];
								state.currentSavedMatchId = null;
								saveMatchRecordsToStorage();
								saveActiveMatchToStorage();
								renderResultView();
								showToast('全ての試合結果を削除しました');
							} else {
								state.matchRecords = state.matchRecords.filter(r => r.id !== targetMatchId);
								if (state.currentSavedMatchId === targetMatchId) {
									state.currentSavedMatchId = null;
								}
								saveMatchRecordsToStorage();
								saveActiveMatchToStorage();
								renderResultView();
								showToast('試合結果を削除しました');
							}
						}
					},
					{
						label: 'キャンセル',
						variant: 'secondary'
					}
				]
			});
		}

		function isMatchInProgress() {
			return (
				state.matchStarted ||
				state.teams[0].points > 0 ||
				state.teams[1].points > 0 ||
				state.teams[0].games > 0 ||
				state.teams[1].games > 0 ||
				state.completedGamesHistory.length > 0
			);
		}

		function showMatchFormatModal() {
			const inProgress = isMatchInProgress();
			const completedGames = Math.max(
				state.completedGamesHistory.length,
				state.teams[0].games + state.teams[1].games
			);
			const maxTeamGames = Math.max(state.teams[0].games, state.teams[1].games);

			const options = [1, 3, 5, 7].map(num => {
				const neededGames = Math.ceil(num / 2);
				// 進行中は、既に終了しているゲーム数以下、または既にどちらかが先取数に達している形式へは変更不可
				const isDisabled = inProgress && (num <= completedGames || maxTeamGames >= neededGames);
				return {
					label: `${num}G` + (state.bestOf === num ? ' ✓' : ''),
					variant: state.bestOf === num ? 'primary' : 'secondary',
					disabled: isDisabled,
					onClick: () => {
						if (state.bestOf === num) return;
						state.bestOf = num;
						if (inProgress) {
							// 進行中の形式変更: スコアや推移データを維持したまま形式のみ変更
							// 変更によって現在のゲームが最終ゲームになり、かつ既に5点以上に達している場合は5点チェンジエンド済扱いにする
							if (isDecidingGame() && (state.teams[0].points >= 5 || state.teams[1].points >= 5)) {
								state.decidingSwapped = true;
							}
							syncUIAndBoard({ animate: false });
							showToast(`${num}ゲームズマッチに変更しました`);
						} else {
							cancelPendingAutoSwap();
							hideInboardBar();
							resetEntireMatch();
							showToast(`${num}ゲームズマッチに設定しました`);
						}
					}
				};
			});

			options.push({
				label: 'キャンセル',
				variant: 'cancel-full'
			});

			openModal({
				title: inProgress ? 'マッチ形式の変更' : 'マッチ形式の選択',
				desc: inProgress
					? '変更するゲーム数をタップして選択してください。'
					: 'プレイするゲーム数をタップして選択してください。',
				buttons: options,
				gridMode: 'format'
			});
		}

		function resetEntireMatch() {
			cancelPendingAutoSwap();
			hideInboardBar();
			state.teams[0].points = 0;
			state.teams[0].games = 0;
			state.teams[1].points = 0;
			state.teams[1].games = 0;
			state.leftTeamIdx = 0;
			state.rightTeamIdx = 1;
			state.initialServerTeamIdx = 0;
			state.decidingSwapped = false;
			state.matchStarted = false;
			state.matchStartTime = null;
			state.matchEndTime = null;
			state.currentSavedMatchId = null;
			state.currentGameRallyLog = [];
			state.actionUndoStack = [];
			state.completedGamesHistory = [];
			syncUIAndBoard({ animate: true, direction: -1 });
			showToast('新しいマッチの準備ができました');
		}

		// ============================================================================
		// 11. 誤動作を防ぐ「タップ完了時（指を離した位置）」での即時カウントアップ
		// ============================================================================
		let activePointerId = null;
		let pressedUnit = null;

		function getHitUnitFromPoint(clientX, clientY) {
			const elem = document.elementFromPoint(clientX, clientY);
			if (!elem) return null;
			const cardEl = elem.closest('.flip-card');
			if (!cardEl) return null;
			return allUnits.find(u => u.el === cardEl) || null;
		}

		function clearPressedUnitState() {
			allUnits.forEach(u => u.setPressedHighlight(false));
			pressedUnit = null;
			activePointerId = null;
		}

		allUnits.forEach(unit => {
			unit.el.addEventListener('pointerdown', (e) => {
				sound.unlock();
				if (isInteractionLocked()) return;
				if (e.button === 2) return;

				activePointerId = e.pointerId;
				pressedUnit = unit;
				unit.setPressedHighlight(true);
			});

			unit.el.addEventListener('contextmenu', (e) => {
				e.preventDefault();
			});
		});

		window.addEventListener('pointermove', (e) => {
			if (e.pointerId !== activePointerId || !pressedUnit) return;
			const currentHoverUnit = getHitUnitFromPoint(e.clientX, e.clientY);
			pressedUnit.setPressedHighlight(currentHoverUnit === pressedUnit);
		});

		window.addEventListener('pointerup', (e) => {
			if (e.pointerId !== activePointerId || !pressedUnit) return;

			const targetUnit = pressedUnit;
			const releasedUnit = getHitUnitFromPoint(e.clientX, e.clientY);
			clearPressedUnitState();

			if (isInteractionLocked()) return;

			if (releasedUnit !== targetUnit) {
				return;
			}

			incrementPanelValue(targetUnit);
		});

		window.addEventListener('pointercancel', () => {
			clearPressedUnitState();
		});

		function syncVoiceBtnUI() {
			btnVoiceEl.classList.toggle('off-state', !state.voiceEnabled);
			voiceSvgOnEl.style.display = state.voiceEnabled ? 'block' : 'none';
			voiceSvgOffEl.style.display = state.voiceEnabled ? 'none' : 'block';
			voiceStateTextEl.textContent = state.voiceEnabled ? 'VOICE' : 'MUTE';
		}

		btnVoiceEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			sound.unlock();
			state.voiceEnabled = !state.voiceEnabled;
			syncVoiceBtnUI();
			saveActiveMatchToStorage();
			if (state.voiceEnabled) {
				sound.speakEnglishCall(buildEnglishScoreCall());
			} else if ('speechSynthesis' in window) {
				try {
					window.speechSynthesis.cancel();
				} catch (e) {}
			}
			const iosNotice = (isIOS && state.voiceEnabled) ? ' (※消音モード時は鳴りません)' : '';
			showToast(`Voice Call: ${state.voiceEnabled ? 'ON' : 'OFF'}${iosNotice}`);
		});

		leftServeBarEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			if (getCurrentServerTeamIdx() !== state.leftTeamIdx) {
				state.initialServerTeamIdx = 1 - state.initialServerTeamIdx;
				syncUIAndBoard({ animate: false });
				showToast(`Server: ${state.teams[state.leftTeamIdx].name}`);
			}
		});
		rightServeBarEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			if (getCurrentServerTeamIdx() !== state.rightTeamIdx) {
				state.initialServerTeamIdx = 1 - state.initialServerTeamIdx;
				syncUIAndBoard({ animate: false });
				showToast(`Server: ${state.teams[state.rightTeamIdx].name}`);
			}
		});

		function syncCurrentSavedRecordPlayerNames() {
			if (!state.currentSavedMatchId) return;
			const rec = state.matchRecords.find(r => r.id === state.currentSavedMatchId);
			if (rec) {
				rec.player0Name = state.teams[0].name;
				rec.player1Name = state.teams[1].name;
				saveMatchRecordsToStorage();
			}
		}

		leftNameInputEl.addEventListener('input', () => {
			const defaultName = state.leftTeamIdx === 0 ? 'Player1' : 'Player2';
			state.teams[state.leftTeamIdx].name = leftNameInputEl.value.trim() || defaultName;
			fitScoreboardNameInput(leftNameInputEl);
			syncCurrentSavedRecordPlayerNames();
			saveActiveMatchToStorage();
		});
		leftNameInputEl.addEventListener('blur', () => {
			leftNameInputEl.value = state.teams[state.leftTeamIdx].name;
			fitScoreboardNameInput(leftNameInputEl);
		});
		rightNameInputEl.addEventListener('input', () => {
			const defaultName = state.rightTeamIdx === 0 ? 'Player1' : 'Player2';
			state.teams[state.rightTeamIdx].name = rightNameInputEl.value.trim() || defaultName;
			fitScoreboardNameInput(rightNameInputEl);
			syncCurrentSavedRecordPlayerNames();
			saveActiveMatchToStorage();
		});
		rightNameInputEl.addEventListener('blur', () => {
			rightNameInputEl.value = state.teams[state.rightTeamIdx].name;
			fitScoreboardNameInput(rightNameInputEl);
		});

		window.addEventListener('resize', () => {
			fitScoreboardNameInput(leftNameInputEl);
			fitScoreboardNameInput(rightNameInputEl);
			resultsListContainerEl.querySelectorAll('.result-player-name-input, .result-memo-input').forEach(el => {
				autoResizeResultNameTextarea(el);
			});
		});

		// ============================================================================
		// 13. PWA (Service Worker) 登録 & ランドスケープ（横画面）固定制御
		// ============================================================================
		// PWA Service Worker 登録
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('./sw.js').then((reg) => {
					console.log('TT-Scoreboard PWA ServiceWorker active:', reg.scope);
				}).catch((err) => {
					console.warn('TT-Scoreboard PWA ServiceWorker registration failed:', err);
				});
			});
		}

		// =========================================================
		// 画面向き & パネル縦長アスペクト比 (常に縦:横 4:3 以上) の常時自動保護
		// =========================================================
		function enforcePanelAspectRatio() {
			const wrapperEl = document.querySelector('.scoreboard-wrapper');
			const contentBoxEl = document.getElementById('scoreboard-content-box');
			if (!wrapperEl || !contentBoxEl) return;

			// 一旦制限を解除して利用可能な高さを計測
			contentBoxEl.style.maxWidth = '1400px';

			const wrapperW = wrapperEl.clientWidth;
			const wrapperH = wrapperEl.clientHeight;
			if (wrapperW <= 0 || wrapperH <= 0) return;

			// ヘッダー（名前バー）を差し引いたステージ利用可能高さ
			const headerEl = document.querySelector('.top-header-bar');
			const headerH = headerEl ? headerEl.offsetHeight : 40;
			const stageAvailH = Math.max(80, wrapperH - headerH - 12);

			// サーブバーとgapの高さを差し引いた、得点カード自体の利用可能高さ
			const serveBarEl = document.getElementById('left-serve-bar');
			const serveBarH = serveBarEl ? serveBarEl.offsetHeight : 16;
			const colGap = 18;
			const cardAvailH = Math.max(60, stageAvailH - serveBarH - colGap);

			// 要件: 「常に縦長で表示。少なくとも縦:横が4:3」
			// 高さ:幅 >= 4:3 (1.333...) => 幅は最大でも 高さ * (3 / 4)
			// ボーダーやパディングを含めて確実に 4:3 以上の縦長比率を保証 (係数 0.71)
			const maxCardW = cardAvailH * 0.71;

			// カラム比率: 34fr 14fr 14fr 34fr (全体 96fr)
			const stageEl = document.getElementById('scoreboard-stage');
			const stageComputedStyle = window.getComputedStyle(stageEl);
			const gridGap = parseFloat(stageComputedStyle.gap) || 12;
			const totalGap = gridGap * 3;

			// カード幅が maxCardW 以下になるステージ全体の最大幅:
			// (stageWidth - totalGap) * (34 / 96) <= maxCardW
			// stageWidth <= (maxCardW * 96 / 34) + totalGap
			const maxStageW = (maxCardW * (96 / 34)) + totalGap;

			const targetMaxW = Math.min(wrapperW, maxStageW, 1400);
			contentBoxEl.style.maxWidth = `${Math.floor(targetMaxW)}px`;
		}

		// 常時ランドスケープ表示制御（スマホ縦持ち時は自動で90度回転して全画面横長展開）
		function applyOrientationMode() {
			const isPortrait = window.matchMedia('(orientation: portrait)').matches || (window.innerHeight > window.innerWidth);
			
			if (isPortrait) {
				document.body.classList.add('is-portrait-locked-90');
				document.body.classList.remove('is-portrait-locked-270');
			} else {
				document.body.classList.remove('is-portrait-locked-90', 'is-portrait-locked-270');
			}

			enforcePanelAspectRatio();

			// 回転後の寸法に合わせてテキストやパネルの自動フィットを再計算
			setTimeout(() => {
				enforcePanelAspectRatio();
				fitScoreboardNameInput(leftNameInputEl);
				fitScoreboardNameInput(rightNameInputEl);
				resultsListContainerEl.querySelectorAll('.result-player-name-input, .result-memo-input').forEach(el => {
					autoResizeResultNameTextarea(el);
				});
			}, 80);
		}

		// Screen Orientation API による横画面ロック常時試行（Android PWA / フルスクリーン対応ブラウザ向け）
		function tryLockScreenOrientation() {
			if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
				window.screen.orientation.lock('landscape').catch(() => {
					// サポート外や未許可ブラウザでは静かにスルー (CSS回転が確実に動作)
				});
			}
		}

		function handleFirstUserInteraction() {
			sound.unlock();
			tryLockScreenOrientation();
		}

		['touchstart', 'touchend', 'pointerdown', 'click'].forEach(evtType => {
			document.addEventListener(evtType, handleFirstUserInteraction, { once: true, passive: true });
		});

		window.addEventListener('resize', applyOrientationMode);
		window.addEventListener('orientationchange', applyOrientationMode);
		if (window.screen && window.screen.orientation) {
			window.screen.orientation.addEventListener('change', applyOrientationMode);
		}

		if (window.ResizeObserver) {
			const ro = new ResizeObserver(() => {
				enforcePanelAspectRatio();
			});
			const wrapperEl = document.querySelector('.scoreboard-wrapper');
			if (wrapperEl) ro.observe(wrapperEl);
		}

		// 初期描画実行 & リロード前の状態（ゲーム終了／マッチ終了バー含む）を復元
		applyOrientationMode();
		tryLockScreenOrientation();
		syncVoiceBtnUI();
		syncUIAndBoard({ animate: false });
		if ((state.pendingPhase === 'game_end' || state.pendingPhase === 'match_end') && state.pendingWinnerIdx !== -1) {
			showInboardBar(state.pendingPhase, state.pendingWinnerIdx);
		}
	</script>
</body>
</html>
