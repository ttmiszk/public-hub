		function showResetConfirmModal() {
			openModal({
				title: 'リセットの確認',
				desc: 'リセットする範囲を選択してください。',
				buttons: [
					{
						label: '現在のゲームをリセット',
						variant: 'primary',
						onClick: () => {
							const isFirstGame = state.completedGamesHistory.length === 0
								&& state.teams[0].games === 0
								&& state.teams[1].games === 0;
							if (isFirstGame) {
								resetEntireMatch();
								return;
							}
							const wasAutoSwapPending = state.autoSwapPending;
							cancelPendingAutoSwap();
							hideInboardBar();
							if (state.decidingSwapped && !wasAutoSwapPending) {
								[state.leftTeamIdx, state.rightTeamIdx] = [state.rightTeamIdx, state.leftTeamIdx];
							}
							state.teams[0].points = 0;
							state.teams[1].points = 0;
							state.currentGameRallyLog = [];
							state.actionUndoStack = [];
							state.decidingSwapped = false;
							syncUIAndBoard({ animate: true, direction: -1 });
							showToast('現在のゲームをリセットしました');
						}
					},
					{
						label: 'マッチ全体をリセット',
						variant: 'danger',
						onClick: () => {
							cancelPendingAutoSwap();
							hideInboardBar();
							resetEntireMatch();
						}
					},
					{
						label: 'キャンセル',
						variant: 'cancel-full'
					}
				]
			});
		}

		function showDeleteResultConfirmModal(targetMatchId = null) {
			if (state.matchRecords.length === 0) return;
			const isDeleteAll = targetMatchId === null;
			openModal({
				title: isDeleteAll ? '全ての試合結果を削除' : '試合結果の削除',
				desc: isDeleteAll
					? '保存されている全ての試合結果とスコア推移を削除しますか？\n（現在進行中のマッチは削除されません）'
					: '選択した試合結果とスコア推移を削除しますか？',
				twoCols: true,
				buttons: [
					{
						label: '削除する',
						variant: 'danger',
						onClick: () => {
							if (isDeleteAll) {
								state.matchRecords = [];
								state.currentSavedMatchId = null;
								saveMatchRecordsToStorage();
								saveActiveMatchToStorage();
								renderResultView();
								showToast('全ての試合結果を削除しました');
							} else {
								state.matchRecords = state.matchRecords.filter(r => r.id !== targetMatchId);
								if (state.currentSavedMatchId === targetMatchId) {
									state.currentSavedMatchId = null;
								}
								saveMatchRecordsToStorage();
								saveActiveMatchToStorage();
								renderResultView();
								showToast('試合結果を削除しました');
							}
						}
					},
					{
						label: 'キャンセル',
						variant: 'secondary'
					}
				]
			});
		}

		function isMatchInProgress() {
			return (
				state.matchStarted ||
				state.teams[0].points > 0 ||
				state.teams[1].points > 0 ||
				state.teams[0].games > 0 ||
				state.teams[1].games > 0 ||
				state.completedGamesHistory.length > 0
			);
		}

		function showMatchFormatModal() {
			const inProgress = isMatchInProgress();
			const completedGames = Math.max(
				state.completedGamesHistory.length,
				state.teams[0].games + state.teams[1].games
			);
			const maxTeamGames = Math.max(state.teams[0].games, state.teams[1].games);

			const options = [1, 3, 5, 7].map(num => {
				const neededGames = Math.ceil(num / 2);
				// 進行中は、既に終了しているゲーム数以下、または既にどちらかが先取数に達している形式へは変更不可
				const isDisabled = inProgress && (num <= completedGames || maxTeamGames >= neededGames);
				return {
					label: `${num}ゲームズ (${neededGames}G先取)` + (state.bestOf === num ? ' ✓' : ''),
					variant: state.bestOf === num ? 'primary' : 'secondary',
					disabled: isDisabled,
					onClick: () => {
						if (state.bestOf === num) return;
						state.bestOf = num;
						if (inProgress) {
							// 進行中の形式変更: スコアや推移データを維持したまま形式のみ変更
							// 変更によって現在のゲームが最終ゲームになり、かつ既に5点以上に達している場合は5点チェンジエンド済扱いにする
							if (isDecidingGame() && (state.teams[0].points >= 5 || state.teams[1].points >= 5)) {
								state.decidingSwapped = true;
							}
							syncUIAndBoard({ animate: false });
							showToast(`${num}ゲームズマッチに変更しました`);
						} else {
							cancelPendingAutoSwap();
							hideInboardBar();
							resetEntireMatch();
							showToast(`${num}ゲームズマッチに設定しました`);
						}
					}
				};
			});

			options.push({
				label: 'キャンセル',
				variant: 'cancel-full'
			});

			openModal({
				title: inProgress ? 'マッチ形式の変更' : 'マッチ形式の選択',
				desc: inProgress
					? '変更するゲーム数をタップして選択してください。'
					: 'プレイするゲーム数をタップして選択してください。',
				buttons: options
			});
		}

		function resetEntireMatch() {
			cancelPendingAutoSwap();
			hideInboardBar();
			state.teams[0].points = 0;
			state.teams[0].games = 0;
			state.teams[1].points = 0;
			state.teams[1].games = 0;
			state.leftTeamIdx = 0;
			state.rightTeamIdx = 1;
			state.initialServerTeamIdx = 0;
			state.decidingSwapped = false;
			state.matchStarted = false;
			state.matchStartTime = null;
			state.matchEndTime = null;
			state.currentSavedMatchId = null;
			state.currentGameRallyLog = [];
			state.actionUndoStack = [];
			state.completedGamesHistory = [];
			syncUIAndBoard({ animate: true, direction: -1 });
			showToast('新しいマッチの準備ができました');
		}

		// ============================================================================
		// 11. 誤動作を防ぐ「タップ完了時（指を離した位置）」での即時カウントアップ
		// ============================================================================
		let activePointerId = null;
		let pressedUnit = null;

		function getHitUnitFromPoint(clientX, clientY) {
			const elem = document.elementFromPoint(clientX, clientY);
			if (!elem) return null;
			const cardEl = elem.closest('.flip-card');
			if (!cardEl) return null;
			return allUnits.find(u => u.el === cardEl) || null;
		}

		function clearPressedUnitState() {
			allUnits.forEach(u => u.setPressedHighlight(false));
			pressedUnit = null;
			activePointerId = null;
		}

		allUnits.forEach(unit => {
			unit.el.addEventListener('pointerdown', (e) => {
				if (isInteractionLocked()) return;
				if (e.button === 2) return;

				activePointerId = e.pointerId;
				pressedUnit = unit;
				unit.setPressedHighlight(true);
			});

			unit.el.addEventListener('contextmenu', (e) => {
				e.preventDefault();
			});
		});

		window.addEventListener('pointermove', (e) => {
			if (e.pointerId !== activePointerId || !pressedUnit) return;
			const currentHoverUnit = getHitUnitFromPoint(e.clientX, e.clientY);
			pressedUnit.setPressedHighlight(currentHoverUnit === pressedUnit);
		});

		window.addEventListener('pointerup', (e) => {
			if (e.pointerId !== activePointerId || !pressedUnit) return;

			const targetUnit = pressedUnit;
			const releasedUnit = getHitUnitFromPoint(e.clientX, e.clientY);
			clearPressedUnitState();

			if (isInteractionLocked()) return;

			if (releasedUnit !== targetUnit) {
				return;
			}

			incrementPanelValue(targetUnit);
		});

		window.addEventListener('pointercancel', () => {
			clearPressedUnitState();
		});

		const btnVoiceEl = document.getElementById('btn-voice');
		const voiceSvgOnEl = document.getElementById('voice-svg-on');
		const voiceSvgOffEl = document.getElementById('voice-svg-off');
		const voiceStateTextEl = document.getElementById('voice-state-text');

		function syncVoiceBtnUI() {
			btnVoiceEl.classList.toggle('off-state', !state.voiceEnabled);
			voiceSvgOnEl.style.display = state.voiceEnabled ? 'block' : 'none';
			voiceSvgOffEl.style.display = state.voiceEnabled ? 'none' : 'block';
			voiceStateTextEl.textContent = state.voiceEnabled ? 'VOICE' : 'MUTE';
		}

		btnVoiceEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			state.voiceEnabled = !state.voiceEnabled;
			syncVoiceBtnUI();
			saveActiveMatchToStorage();
			if (state.voiceEnabled) {
				sound.speakEnglishCall(buildEnglishScoreCall());
			} else if ('speechSynthesis' in window) {
				window.speechSynthesis.cancel();

			showToast(`Voice Call: ${state.voiceEnabled ? 'ON' : 'OFF'}`);
		});

		leftServeBarEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			if (getCurrentServerTeamIdx() !== state.leftTeamIdx) {
				state.initialServerTeamIdx = 1 - state.initialServerTeamIdx;
				syncUIAndBoard({ animate: false });
				showToast(`Server: ${state.teams[state.leftTeamIdx].name}`);
			}
		});
		rightServeBarEl.addEventListener('click', () => {
			if (isInteractionLocked()) return;
			if (getCurrentServerTeamIdx() !== state.rightTeamIdx) {
				state.initialServerTeamIdx = 1 - state.initialServerTeamIdx;
				syncUIAndBoard({ animate: false });
				showToast(`Server: ${state.teams[state.rightTeamIdx].name}`);
			}
		});

		function syncCurrentSavedRecordPlayerNames() {
			if (!state.currentSavedMatchId) return;
			const rec = state.matchRecords.find(r => r.id === state.currentSavedMatchId);
			if (rec) {
				rec.player0Name = state.teams[0].name;
				rec.player1Name = state.teams[1].name;
				saveMatchRecordsToStorage();
			}
		}

		leftNameInputEl.addEventListener('input', () => {
			const defaultName = state.leftTeamIdx === 0 ? 'Player1' : 'Player2';
			state.teams[state.leftTeamIdx].name = leftNameInputEl.value.trim() || defaultName;
			fitScoreboardNameInput(leftNameInputEl);
			syncCurrentSavedRecordPlayerNames();
			saveActiveMatchToStorage();
		});
		leftNameInputEl.addEventListener('blur', () => {
			leftNameInputEl.value = state.teams[state.leftTeamIdx].name;
			fitScoreboardNameInput(leftNameInputEl);
		});
		rightNameInputEl.addEventListener('input', () => {
			const defaultName = state.rightTeamIdx === 0 ? 'Player1' : 'Player2';
			state.teams[state.rightTeamIdx].name = rightNameInputEl.value.trim() || defaultName;
			fitScoreboardNameInput(rightNameInputEl);
			syncCurrentSavedRecordPlayerNames();
			saveActiveMatchToStorage();
		});
		rightNameInputEl.addEventListener('blur', () => {
			rightNameInputEl.value = state.teams[state.rightTeamIdx].name;
			fitScoreboardNameInput(rightNameInputEl);
		});

		window.addEventListener('resize', () => {
			fitScoreboardNameInput(leftNameInputEl);
			fitScoreboardNameInput(rightNameInputEl);
			resultsListContainerEl.querySelectorAll('.result-player-name-input').forEach(el => {
				autoResizeResultNameTextarea(el);
			});
		});

		// 初期描画実行 & リロード前の状態（ゲーム終了／マッチ終了バー含む）を復元
		syncVoiceBtnUI();
		syncUIAndBoard({ animate: false });
		if ((state.pendingPhase === 'game_end' || state.pendingPhase === 'match_end') && state.pendingWinnerIdx !== -1) {
			showInboardBar(state.pendingPhase, state.pendingWinnerIdx);
		}
	</script>
</body>
</html>
