    <!-- MIDDLE SECTION: Planet Selector Drawer & Info Card -->
    <section class="hud-middle-container">
      <!-- 天体クイックセレクター (左ドロワー) -->
      <aside class="planet-nav-drawer glass-panel interactive" id="planet-list" aria-label="天体リスト">
        <!-- JSで動的生成 -->
      </aside>

      <!-- 選択天体の詳細情報カード (右パネル) -->
      <article class="celestial-info-card glass-panel interactive" id="celestial-info-panel" aria-label="天体詳細情報">
        <div class="info-card-header">
          <div class="info-title-group">
            <div class="info-dot" id="info-dot"></div>
            <div>
              <h2 id="info-title">天体名</h2>
              <p id="info-en-title">Celestial Body</p>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="info-badge" id="info-type-badge">惑星</span>
            <span class="info-tracking-badge" title="追従モード中 (右ドラッグまたは全景リセットで解除)">追従中</span>
          </div>
        </div>

        <!-- 視点からのリアルタイム距離表示 & ズームボタン (概要の上に配置) -->
        <div class="info-camera-actions">
          <div class="info-distance-box">
            <span class="info-distance-label">視点からの距離</span>
            <span class="info-distance-val" id="info-cam-distance">---</span>
          </div>
          <button id="btn-zoom-to-body" class="info-zoom-btn" title="天体に視野角5度までズーム接近します">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            <span>ズーム</span>
          </button>
        </div>

        <p class="info-description" id="info-desc">天体の解説がここに表示されます。</p>

        <div class="info-facts" id="info-facts-list">
          <!-- JSで動的生成 -->
        </div>
      </article>
    </section>

    <!-- BOTTOM BAR (FOOTER AREA) -->
    <footer class="hud-footer-area">
      <!-- 左下操作ガイドヒント -->
      <div class="controls-guide-hint">
        🖱️ 左ドラッグ: 視点回転 / 右ドラッグ: 平行移動 / ホイール: ズーム<br>
        ⌨️ [Space]: 一時停止 / [O]: 軌道 / [L]: ラベル / [Z]: ズーム / [R]: 全景 / [0-9]: 天体選択
      </div>

      <!-- 右寄せ時間HUDコントローラー -->
      <div class="hud-bottom-bar">
        <div class="time-controller-panel glass-panel interactive">
          <!-- 再生/一時停止 -->
          <button id="btn-play-pause" class="play-pause-btn" title="再生 / 一時停止 (Space)">
            <svg id="icon-play" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>

          <!-- 速度スライダー＆プリセット -->
          <div class="speed-control-group">
            <div class="speed-slider-wrap">
              <span style="font-size: 0.75rem; color: var(--text-secondary);">速度</span>
              <input type="range" id="speed-slider" class="hud-slider" min="0" max="100" value="0" title="公転速度調整 (1x〜1年/秒)" />
              <span class="speed-badge" id="speed-value">1x (実時間)</span>
            </div>

            <div class="speed-presets">
              <button class="preset-btn active" data-speed="1">1x</button>
              <button class="preset-btn" data-speed="3600">1h/s</button>
              <button class="preset-btn" data-speed="86400">1d/s</button>
              <button class="preset-btn" data-speed="2592000">1m/s</button>
              <button class="preset-btn" data-speed="31536000">1y/s</button>
            </div>
          </div>

          <!-- 日時表示 ＆ 日時指定ダイアログ展開ボタン ＆ 現在リセットボタン -->
          <div class="date-control-group">
            <!-- 日時等幅テキスト表示 (クリックでダイアログ展開) -->
            <div class="date-display-box" id="time-counter" title="クリックして日時を指定">
              2026-08-14 19:19:00
            </div>

            <!-- 日時設定ダイアログ展開ボタン -->
            <button id="btn-open-calendar" class="hud-mini-btn" title="任意の日時を指定">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>

            <!-- 現在日時にリセットボタン -->
            <button id="btn-reset-now" class="hud-mini-btn" title="現在日時にリセット">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span style="font-size: 0.72rem; margin-left: 2px;">現在</span>
            </button>
          </div>
        </div>
      </div>
    </footer>

    <!-- 日時指定モーダルダイアログ (マウス操作OK/Cancel対応) -->
    <div id="datetime-modal-overlay" class="datetime-modal-overlay">
      <div class="datetime-modal-content glass-panel">
        <div class="datetime-modal-header">
          <h3>📅 シミュレーション日時の指定</h3>
          <button id="btn-modal-close" class="modal-close-btn" aria-label="閉じる">&times;</button>
        </div>
        <div class="datetime-modal-body">
          <label for="dialog-datetime-input" class="dialog-label">日時 (UTC/JST):</label>
          <input type="datetime-local" id="dialog-datetime-input" class="dialog-datetime-picker" step="1" />
          <div class="quick-preset-row">
            <span class="preset-label">クイック設定:</span>
            <button id="btn-quick-now" class="modal-quick-btn">現在時刻 (Now)</button>
            <button id="btn-quick-j2000" class="modal-quick-btn">J2000.0 (2000年)</button>
          </div>
        </div>
        <div class="datetime-modal-footer">
          <button id="btn-modal-cancel" class="modal-btn modal-cancel-btn">キャンセル</button>
          <button id="btn-modal-apply" class="modal-btn modal-apply-btn">決定 (OK)</button>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
